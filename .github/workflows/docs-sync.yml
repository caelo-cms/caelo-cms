# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — release docs-sync (epic #825; #827, #828).
#
# After every successful `release` run (and on demand), prepares the
# documentation work for caelo-cms.com:
#
#   release mode  the merged PRs since the previous stable release that
#                 carry the `user-facing` label, each with its
#                 "## User docs affected" section, plus the release notes,
#                 turned into chat messages for Caelo's own AI
#                 (scripts/docs-sync-prompt.ts); and the public developer
#                 reference (Plugin SDK, Query API, provisioning CLI)
#                 generated from the release tag (scripts/docs-reference.ts).
#   seed mode     one chat message per page of the `docs/cms-seed` branch
#                 (`seed/*.md`, frontmatter `path:` + `title:`).
#
# The result is the `docs-sync-*` artifact and the job summary. Nothing is
# sent to caelo-cms.com yet: CI cannot pass the admin's Google IAP without
# weakening CLAUDE.md §11.B (the gap and the proposal are on #827). The
# step that sends the messages over the `caelo_chat` MCP surface — with the
# MCP token from the `docs-sync` environment — lands with that fix. The
# workflow never publishes either way: the Owner reviews the chat's preview
# and publishes by click.
#
# Security: no pull_request trigger (public repo), read-only token, no
# secrets. workflow_dispatch is refused outside `main`.

name: docs-sync

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "release = docs for a release's user-facing PRs; seed = one page per file on docs/cms-seed"
        type: choice
        options: [release, seed]
        default: release
      release:
        description: "Release tag for release mode (e.g. v0.10.53). Empty = the latest stable GitHub Release."
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

# One run per release (or per seed) at a time; a re-run waits instead of
# racing the previous one. Re-runs are safe: the output is deterministic.
concurrency:
  group: docs-sync-${{ inputs.mode || 'release' }}-${{ inputs.release || github.event.workflow_run.head_branch || 'latest' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: prepare docs work
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event != 'pull_request')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # tags + history for the release range
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve mode and release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RELEASE: ${{ inputs.release }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          mode="${INPUT_MODE:-release}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          [ "${mode}" = "release" ] || exit 0
          # A tag-push release run names its tag; a dispatched one ran on
          # main, so the release it just published is the latest stable.
          release="${INPUT_RELEASE}"
          if [ -z "${release}" ] && [ "${EVENT}" = "workflow_run" ] && [[ "${RUN_HEAD_BRANCH}" == v* ]]; then
            release="${RUN_HEAD_BRANCH}"
          fi
          if [ -z "${release}" ]; then
            release="$(gh release list --repo "${REPO}" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if ! [[ "${release}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${release:-<none>} is not a stable release; no docs run."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"

      # The release tag and the seed branch are read from the git objects of
      # the main checkout above (`git show <ref>:<path>`), never checked
      # out or executed: only main's scripts run in this job.
      - name: Prepare (release)
        if: steps.target.outputs.mode == 'release' && steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ steps.target.outputs.release }}
        run: bun scripts/docs-sync.ts release --release "${RELEASE}" --repo "${REPO}" --out docs-sync-out

      - name: Prepare (seed)
        if: steps.target.outputs.mode == 'seed'
        run: bun scripts/docs-sync.ts seed --out docs-sync-out

      - name: Upload docs work
        # Also on failure: the summary names the PRs to fix, and the
        # messages that were built are still worth reviewing.
        if: always() && steps.target.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-sync-${{ steps.target.outputs.mode }}-${{ steps.target.outputs.release || 'seed' }}
          path: docs-sync-out/
          if-no-files-found: warn
          retention-days: 30
