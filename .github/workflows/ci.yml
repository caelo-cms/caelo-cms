name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Opt every JavaScript-based action into Node 24 ahead of GitHub's
  # June-2026 cutover. Action authors haven't yet bumped action.yml
  # `runs.using` to `node24`, so the "being forced to run on Node 24"
  # advisory keeps printing. Bump action pins when the next majors
  # ship with native Node 24 support.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lockfile:
    name: Lockfile freshness
    # Least-privilege GITHUB_TOKEN: this job only reads the repo.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install without frozen lockfile
        run: bun install

      - name: Assert lockfile is up to date
        run: |
          if ! git diff --exit-code -- bun.lock package.json apps/*/package.json packages/*/package.json; then
            echo ""
            echo "::error::bun.lock is out of date with package.json files."
            echo "::error::Run 'bun install' locally and commit the resulting bun.lock."
            exit 1
          fi

  check:
    name: Lint, Typecheck, Migrate, Test, License
    needs: lockfile
    # Least-privilege GITHUB_TOKEN: read the repo + upload an artifact; no
    # registry, PR, or issue writes.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # 2026-07-27: was 10, which the suite had grown into. Three runs that day
    # landed at 9m57s (reported success), 10m06s and 10m36s (both cancelled) —
    # and the cancelled ones had already printed "613 pass / 0 fail" and
    # "[coverage] gate PASSED" before the kill. The gate was being decided by
    # runner noise rather than by the code. Raised to give real headroom; the
    # test step itself is ~7 min, the rest is install + bootstrap + migrate.
    # 2026-10-30 (#1267): main had grown to 18m33s (integration suite 665 s);
    # the change journal adds one journal row per write statement (~0.25 ms
    # measured locally) and its own tests, and the run cancelled at 20m12s
    # after "0 fail" and "[coverage] gate PASSED" — the same noise-decided
    # gate as above. Raised again for headroom.
    timeout-minutes: 30

    env:
      POSTGRES_USER: caelo
      POSTGRES_PASSWORD: caelo_ci
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      ADMIN_ROLE_PASSWORD: caelo_admin_ci
      PUBLIC_ROLE_PASSWORD: caelo_public_ci
      ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_admin
      PUBLIC_ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_public
      PUBLIC_DATABASE_URL: postgres://public_role:caelo_public_ci@localhost:5432/cms_public
      # #566 — caddy-validate.test.ts runs `caddy validate` on the generated
      # self-hosted Caddyfile with the pinned Caddy image. Required here, so
      # a runner without Docker fails the job instead of skipping the check.
      CAELO_CADDY_VALIDATE: required
      # #980 - firestore-store.test.ts runs the bug intake's Firestore store
      # against the emulator started below. Required here, so a missing
      # emulator fails the job instead of skipping the suite.
      CAELO_FIRESTORE_EMULATOR: required
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8915

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caelo
          POSTGRES_PASSWORD: caelo_ci
          POSTGRES_DB: postgres
          ADMIN_ROLE_PASSWORD: caelo_admin_ci
          PUBLIC_ROLE_PASSWORD: caelo_public_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caelo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Setup Deno for external plugin tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Bootstrap databases (roles + cms_admin + cms_public)
        # Single source of truth: packages/migrations/src/bootstrap.sh. Same script
        # runs under docker-entrypoint-initdb.d on first container boot. libpq
        # picks up PGHOST / PGPASSWORD so TCP vs socket is just env config.
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          chmod +x packages/migrations/src/bootstrap.sh
          packages/migrations/src/bootstrap.sh

      - name: Sync SvelteKit types (generates .svelte-kit/types for the admin app)
        run: bun run --filter=@caelo-cms/admin sync

      - name: Lint
        run: bun run lint

      - name: Knip (dead-code gate)
        # Issue #12 — knip detects unused files, unused exports, and
        # unused dependencies across every workspace. Default mode here
        # rather than `--strict` because `--strict` implies production-
        # only analysis (excludes devDependencies + tests), and Caelo's
        # e2e helpers / migration tooling live outside the production
        # tree — `--strict` would flag them as unreachable. The
        # `github-actions` reporter emits inline annotations on the PR.
        run: bun run knip:strict

      - name: Circular dependencies (madge)
        # Issue #13 — madge fails the build on any new runtime import
        # cycle (`madge --circular apps packages`, exit non-zero on a
        # cycle). Sits next to knip: both are fast static gates that
        # need only the earlier `bun install`, no Postgres. `.madgerc`
        # sets skipTypeImports so type-only edges (erased under
        # verbatimModuleSyntax) don't count as runtime cycles. See
        # docs/dev/madge.md.
        run: bun run circular

      - name: Lockstep version check
        # P20 — every workspace package.json + version.ts must agree.
        # Catches PRs that hand-edit a single package's version field
        # (drift would silently ship). Bumps go through scripts/release.ts.
        run: bun scripts/release.ts --check

      - name: Typecheck
        run: bun run typecheck

      - name: Run migrations
        run: bun run db:migrate

      - name: Install Playwright chromium (live screenshotter tests)
        # PR #869 — the site-importer's live Chromium suites
        # (browser-egress.test.ts SSRF egress canary, hidden-elements.test.ts)
        # FAIL under CI without a browser instead of passing vacuously.
        # Same repo-pinned CLI the screenshotter's launch hint names.
        # #984 - the composite action serves the apt fonts from actions/cache
        # instead of the (often 30 kB/s) Ubuntu mirror.
        uses: ./.github/actions/playwright-chromium

      - name: Start Firestore emulator (bug intake store tests)
        # #980 - the emulator jar firebase-tools pins, verified by SHA-256
        # before it runs. Java 21 is preinstalled on ubuntu-latest.
        env:
          EMULATOR_VERSION: 1.22.0
          EMULATOR_SHA256: 9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c
        run: |
          jar="$RUNNER_TEMP/cloud-firestore-emulator.jar"
          curl -fsSL -o "$jar" "https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v${EMULATOR_VERSION}.jar"
          echo "${EMULATOR_SHA256}  $jar" | sha256sum -c -
          nohup "$JAVA_HOME_21_X64/bin/java" -jar "$jar" --host=127.0.0.1 --port=8915 > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs "http://$FIRESTORE_EMULATOR_HOST/" > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/firestore-emulator.log"
          exit 1

      - name: Test + coverage gate
        # Issue #14 — runs the full suite split into the unit
        # (`*.test.ts`) and integration (`*.integration.test.ts`) tiers
        # under `bun test --coverage`, then enforces the per-tier ratchet
        # floors in scripts/coverage-thresholds.json (CLAUDE.md §6: unit
        # line coverage, integration = % of declared Query API ops
        # exercised). Fails the build when a tier drops below its floor.
        # Replaces the bare `bun test --isolate` step — the gate runs every
        # test exactly once; the integration tier keeps `--isolate` so the
        # per-file Postgres reset in scripts/test-preload.ts still fires.
        run: bun run coverage:check

      - name: Upload coverage report
        # `if: always()` so the lcov + summary land as an artifact even
        # when the gate step above fails — that's exactly when you want to
        # inspect what dropped below the floor.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      - name: License check (MPL-2.0 compatibility)
        run: bun run license:check

  rows-read:
    name: Rows read per request op (pg_stat_statements)
    needs: lockfile
    # Least-privilege GITHUB_TOKEN: this job only reads the repo.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Issue #1267 (rule 7, docs/dev/state-and-changes.md) — every
    # `readScope: "request"` op of the inputs registry runs on a small and a
    # 10x larger fixture; it fails when the large run issues more statements
    # or reads more than 1.5x. Its own database: pg_stat_statements must be
    # preloaded (a services container cannot take server flags) and nothing
    # else may run against it while it measures.
    env:
      POSTGRES_USER: caelo
      POSTGRES_PASSWORD: caelo_ci
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      ADMIN_ROLE_PASSWORD: caelo_admin_ci
      PUBLIC_ROLE_PASSWORD: caelo_public_ci
      ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_admin
      PUBLIC_ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_public
      PUBLIC_DATABASE_URL: postgres://public_role:caelo_public_ci@localhost:5432/cms_public
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Start Postgres with pg_stat_statements
        run: |
          docker run -d --name rows-read-pg --network host \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            postgres:17-alpine \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=top
          # Over TCP: the image's init phase answers on its socket only, then
          # restarts; a socket check would pass before the server is up.
          for i in $(seq 1 90); do
            docker exec rows-read-pg pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" && break
            sleep 1
          done
          docker exec rows-read-pg pg_isready -h 127.0.0.1 -U "$POSTGRES_USER"

      - name: Bootstrap databases, migrate, enable pg_stat_statements
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          chmod +x packages/migrations/src/bootstrap.sh
          packages/migrations/src/bootstrap.sh
          bun run db:migrate
          # The reset's signature differs by Postgres version: grant every overload.
          docker exec -i rows-read-pg psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d cms_admin <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          DO $do$
          DECLARE f regprocedure;
          BEGIN
            FOR f IN SELECT oid::regprocedure FROM pg_proc WHERE proname = 'pg_stat_statements_reset' LOOP
              EXECUTE format('GRANT EXECUTE ON FUNCTION %s TO admin_role', f);
            END LOOP;
          END
          $do$;
          SQL

      - name: Rows-read test
        env:
          CAELO_ROWS_READ: "1"
        run: bun run test ./packages/admin-core/src/__tests__/rows-read.integration.test.ts --timeout 1500000

  e2e:
    name: Playwright E2E (admin shell smoke)
    needs: check
    # Least-privilege GITHUB_TOKEN: this job only reads the repo.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright admin shell smoke. Runs against the production build under
    # `vite preview` via the adapter-node output, matching the configuration
    # that ships. #36 fixed the original SSR module-not-found by building
    # @caelo-cms/shared (the step below); #52 fixed the follow-on Bun /
    # Rollup native-binding SIGILL via two root-cause changes (no
    # job-local workaround): `bunfig.toml` set `linker = "hoisted"`
    # project-wide so Rollup's native binding lands on its resolution path,
    # and `apps/admin/vite.config.ts` externalized `playwright-core` /
    # `@playwright/test` / `@axe-core/playwright` from the SSR build so
    # Vite stops walking those (test-only) trees during `bun run build`.
    # This job is no longer masked — a failure here blocks merging.

    env:
      POSTGRES_USER: caelo
      POSTGRES_PASSWORD: caelo_ci
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      ADMIN_ROLE_PASSWORD: caelo_admin_ci
      PUBLIC_ROLE_PASSWORD: caelo_public_ci
      ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_admin
      PUBLIC_ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_public
      PUBLIC_DATABASE_URL: postgres://public_role:caelo_public_ci@localhost:5432/cms_public

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caelo
          POSTGRES_PASSWORD: caelo_ci
          POSTGRES_DB: postgres
          ADMIN_ROLE_PASSWORD: caelo_admin_ci
          PUBLIC_ROLE_PASSWORD: caelo_public_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caelo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Setup Deno for external plugin tests
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # `@caelo-cms/shared` publishes a compiled `dist/` (its package.json
      # `main` points there) and the admin app's Vite SSR build can't
      # resolve it otherwise. Narrowly building only this package — other
      # dist-shipping workspaces (`mcp-server`, `provisioning`) are not on
      # any admin SSR import path, and broadening to `@caelo-cms/*` would
      # also rebuild `@caelo-cms/admin`, duplicating the Vite build that
      # Playwright's webServer runs immediately after.
      # Mirrors the side-effect of `bun run typecheck` in the `check` job.
      - name: Build @caelo-cms/shared (admin SSR dep)
        run: bun run --filter '@caelo-cms/shared' build

      - name: Bootstrap databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          chmod +x packages/migrations/src/bootstrap.sh
          packages/migrations/src/bootstrap.sh

      - name: Run migrations
        run: bun run db:migrate

      - name: Install Playwright chromium
        # #984 - apt fonts from actions/cache, not the Ubuntu mirror.
        uses: ./.github/actions/playwright-chromium

      - name: Run Playwright smoke tests
        run: bun run e2e
        working-directory: apps/admin

      # Traces + error contexts of failing specs (playwright.config.ts keeps a
      # trace on failure). Without them a flaky spec's CI failure is a bare
      # "Test timeout of 30000ms exceeded" with nothing to root-cause from.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 14

  admin-prod-image:
    name: Admin production image — boot smoke
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least-privilege GITHUB_TOKEN scope. The job only checks out the
    # repo, builds the admin image locally, and `docker run`s it — no
    # registry writes, no PR comments, no issue updates. Explicitly
    # scoping to `contents: read` shrinks the blast radius if a
    # transitive third-party action (checkout, setup-buildx,
    # build-push-action) is ever compromised.
    permissions:
      contents: read
    # A rapid `git push` to a PR branch supersedes the prior boot-smoke
    # run's relevance; cancelling the in-flight job saves ~60-90s of CI
    # per push iteration. Push-to-main runs keep `cancel-in-progress:
    # false` so a main-bound build is never interrupted by a follow-up
    # commit. Mirrors release-images.yml's workflow-level pattern.
    concurrency:
      group: admin-prod-image-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Issue #55 — complements release-images.yml's PR build gate (#54)
    # with a boot smoke. release-images builds + publishes; this job
    # builds the admin image alone (no push, no sign, no mirror) and
    # `docker run`s it to confirm the SvelteKit + adapter-node server
    # actually boots. The bug class #53 fixed (Cannot find module
    # "oxc-parser") succeeds at Docker build time and only crashes on
    # `docker run` — release-images alone cannot catch it.
    #
    # Fake DB URLs are intentional: the lazy query context
    # (apps/admin/src/lib/server/query.ts) and the `.catch`-wrapped
    # bootstraps in hooks.server.ts mean the server binds PORT without
    # touching the database, so a successful port-bind is a sufficient
    # signal that the JS bundle loaded correctly. MODULE_NOT_FOUND
    # crashes happen at module load BEFORE the port binds and surface
    # here as a never-bound port.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build admin image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: caelo-admin:smoke
          # Read from BOTH release-images' admin matrix-job cache scope
          # AND this job's own scope. Write only to our own scope so we
          # never thrash release-images' cache. Buildx supports multiple
          # cache-from entries.
          cache-from: |
            type=gha,scope=admin
            type=gha,scope=admin-smoke
          cache-to: type=gha,scope=admin-smoke,mode=max

      - name: Boot smoke (port wait + alive check)
        run: |
          set -euo pipefail

          docker run -d --name smoke -p 3000:3000 \
            -e PORT=3000 \
            -e ORIGIN=http://localhost:3000 \
            -e ADMIN_DATABASE_URL=postgres://nobody:nothing@127.0.0.1:9/nope \
            -e PUBLIC_DATABASE_URL=postgres://nobody:nothing@127.0.0.1:9/nope \
            caelo-admin:smoke

          # Wait up to 30s for any HTTP response on /. A 3-digit status
          # code (even 5xx) means the JS bundle loaded and the listener
          # attached — that's the load-bearing signal.
          start=$SECONDS
          deadline=$((SECONDS + 30))
          connected=0
          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 \
              http://localhost:3000/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "Boot OK: GET / returned HTTP $code after $((SECONDS - start))s"
              connected=1
              break
            fi
            sleep 1
          done

          if [ "$connected" -ne 1 ]; then
            echo "::error::Admin image did not boot within 30s — likely Cannot-find-module-class regression"
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          fi

          # Catches the rare "bound the port then crashed mid-boot" case.
          running=$(docker inspect -f '{{.State.Running}}' smoke)
          if [ "$running" != "true" ]; then
            echo "::error::Admin container exited after binding port"
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          fi

          # #428 — the image must be able to take screenshots: launch the
          # bundled full Chromium the way the screenshotter does (channel
          # "chromium") and render a page, inside the running container.
          if ! docker exec smoke bun -e '
            const pw = await import("playwright");
            const b = await pw.chromium.launch({ headless: true, channel: "chromium" });
            const p = await b.newPage();
            await p.setContent("<h1>caelo</h1>");
            const png = await p.screenshot();
            await b.close();
            if (png.length < 100) throw new Error("empty screenshot");
            console.log("Chromium OK:", b.version(), png.length, "bytes");
          '; then
            echo "::error::Bundled Chromium cannot launch or capture inside the admin image"
            docker logs smoke 2>&1 | tail -50 || true
            docker rm -f smoke || true
            exit 1
          fi
          # #553 — the quality gate's Lighthouse audit must run in the image:
          # the admin spawns the audit child under the image's Bun, which
          # drives the same bundled Chromium over CDP. Audits a loopback page
          # (3 Performance runs) and asserts scores + a planted finding.
          if ! docker exec smoke bun /app/packages/admin-core/scripts/lighthouse-smoke.ts; then
            echo "::error::The Lighthouse quality audit cannot run inside the admin image"
            docker logs smoke 2>&1 | tail -50 || true
            docker rm -f smoke || true
            exit 1
          fi
          echo "Image size: $(docker image inspect caelo-admin:smoke --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1000000}')"

          # SIGTERM must end the process cleanly. `docker stop` escalates to
          # SIGKILL (exit 137) after the timeout, which is what happens when
          # the bootstrapped workers keep the event loop alive and nothing
          # exits on adapter-node's `sveltekit:shutdown`.
          docker stop -t 15 smoke
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          if [ "$exit_code" != "0" ]; then
            echo "::error::Admin did not exit cleanly on SIGTERM (exit code $exit_code; 137 = killed after timeout)"
            docker logs smoke 2>&1 | tail -50 || true
            docker rm -f smoke || true
            exit 1
          fi

          echo "--- container log tail (success path) ---"
          docker logs smoke 2>&1 | head -50 || true
          docker rm -f smoke
