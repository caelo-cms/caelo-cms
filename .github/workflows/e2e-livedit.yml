name: E2E Live Edit (real AI)

# Issue #47 — drives the editor chat against the real Anthropic API
# (Sonnet 5, adaptive thinking) so the regression classes the mock-AI
# suite cannot catch (empty AI turns, orphan locks, missing primers)
# get caught. Each run costs real money, so what runs when is decided by
# the `plan` job — see WHEN IT RUNS below and docs/internal/e2e-livedit.md.
#
# PR #61 follow-up: switched from Sonnet 4.6 to Opus 4.7. Sonnet was
# tripping ~4/6 scenarios on AI-variance failures; with Opus, any
# remaining red is a real bug (prompt, code, process) not model
# planning variance. Revisit the model choice once the suite has been
# stable for a few weeks. Model is pinned in
# `apps/admin/playwright.livedit.config.ts:E2E_LIVEDIT_MODEL`.
#
# Cost-metric follow-up: the `Capture real AI cost from ai_calls` step
# dumps the run's real spend (SUM of cost_estimate_microcents, tokens,
# per-model breakdown, unpriced-call count) to
# `apps/admin/test-results/livedit/ai-cost.json`. It surfaces three
# ways: (1) a greppable `e2e-livedit-cost …` line in the run summary +
# a `::notice`, (2) an always()-uploaded `e2e-livedit-cost-<run_id>`
# artifact (90-day retention) as the durable per-run record, and (3) a
# `### Real AI cost (this run)` section in the sticky PR comment via
# build-stats.ts. This is the per-run optimization metric requested by
# the operator; it became meaningful once #297 fixed the missing
# ai_pricing row that had been zeroing cost_estimate_microcents.

# WHEN IT RUNS (cost cut 2026-10-27, budget ~$55/week; measured 2026-10-20..26:
# $907 for 183 paid runs on 95 PR branches, ~$5 per full run).
# docs/internal/e2e-livedit.md "When it runs" has the full rules; in short:
#
#   - Pull requests run Real-AI only on request: label `real-ai` runs the
#     scenarios the PR's change can break (the `plan` job maps the changed
#     files through apps/admin/e2e-livedit/scenario-paths.ts, lib/plan.ts),
#     label `real-ai-full` runs everything. Adding the label starts the run
#     (`labeled` event). Without a label the check passes as skipped and,
#     when the change is AI-relevant, the sticky PR comment says what would
#     run and how to opt in. Adding any OTHER label keeps the commit's
#     previous Real-AI verdict (a red stays red) instead of re-deciding.
#   - Follow-up pushes of a labelled PR re-run only what is red or whose
#     covered files changed: each run records the scenarios it left green
#     with a key over the PR's changes to their covered files (artifact
#     e2e-livedit-scenario-greens-<run_id>-<attempt>).
#   - The paid job starts only after the cheap CI checks passed on the PR's
#     head commit and never for a draft. A red CI check FAILS this check (so
#     re-running CI to green cannot leave it skipped-green); re-run this
#     workflow after fixing CI.
#   - A running paid job is never cancelled by a new push (a cancelled run is
#     already paid for): job-level concurrency queues the newest one and
#     GitHub drops the older pending one; a job that starts for a commit that
#     is no longer the PR head cancels itself before spending.
#   - Two runs of the SAME commit (a push and a label seconds apart) both
#     plan before either paid job ends; the second queues behind the first.
#     Once it holds the slot it re-reads what the first left (plan.json
#     consultedRuns, lib/plan.ts replanAfterWait): its greens carry over and
#     nothing left to run passes without paid steps; a red first run FAILS
#     the second — the commit's failures stand, a duplicate never re-rolls
#     them green.
#   - The release gate (release-cut dispatches this workflow on
#     release-gate/<sha>) re-runs only the scenarios whose covered files (or
#     the harness) changed since that scenario's last green on main, or
#     whose last green is older than 7 days; the rest carry over
#     (lib/main-greens.ts, records on the e2e-livedit-ledger branch). It is
#     exempt from the budget: a release is never blocked by spend. Main is
#     not run per push (operator direction 2026-10-09).
#   - A manual workflow_dispatch runs the full suite and respects the weekly
#     budget unless `override_budget` is ticked.
#   - Weekly budget: the trailing-7-day spend of EVERY run (PR, release gate,
#     dispatch) from the e2e-livedit-ledger branch (lib/budget.ts) over
#     `vars.E2E_LIVEDIT_WEEKLY_BUDGET_USD` skips PR runs and dispatches with
#     a passing, annotated check.
#
# Every "nothing to run" verdict SKIPS the `Real-AI live-edit scenario` job;
# a skipped job satisfies the required status check of the same name
# (ruleset main-protection). Every "must not merge" verdict (plan job failed,
# CI red, a red verdict kept on an unrelated label) RUNS the job and fails it
# in its first step instead — a failing gate job would skip the required
# check, and a skipped check passes. A release gate whose scenarios all carry
# over RUNS the job without its paid steps, so release-cut sees it succeed.
on:
  pull_request:
    branches: [main]
    # `labeled`: adding `real-ai` / `real-ai-full` starts the run.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      override_budget:
        description: "Run even when the weekly Real-AI budget is used up"
        required: false
        default: false
        type: boolean

env:
  # See ci.yml — Node 24 advisory shim until action authors update.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Decides what the paid job runs (lib/plan.ts, lib/main-greens.ts,
  # lib/budget.ts) and waits for the cheap CI checks. Costs runner minutes
  # only — no AI call. Its outputs:
  #   mode   skip | run | blocked   (blocked = the paid job fails at once)
  #   reason one line for the logs and the PR comment
  #   scenarios  CAELO_LIVEDIT_SCENARIOS (empty = every spec)
  #   full   true when every CI scenario runs (green-tree reuse by release-cut)
  #   paid   false when a release gate carries every scenario over
  #   kind   pr | release | dispatch
  #   record_main  true when the run's greens count for main (release gate,
  #                dispatch on main) and go to the ledger
  plan:
    name: Real-AI plan (selection, budget, CI wait)
    runs-on: ubuntu-latest
    # Waiting for CI's check job (~16 min) is most of this.
    timeout-minutes: 75
    permissions:
      contents: read
      # Prior runs' greens + their artifacts.
      actions: read
      # The cheap CI checks of the head commit.
      checks: read
      # The PR's files, labels and draft state; the budget-skip comment.
      pull-requests: write
    outputs:
      mode: ${{ steps.verdict.outputs.mode }}
      reason: ${{ steps.verdict.outputs.reason }}
      scenarios: ${{ steps.verdict.outputs.scenarios }}
      full: ${{ steps.verdict.outputs.full }}
      paid: ${{ steps.verdict.outputs.paid }}
      kind: ${{ steps.kind.outputs.kind }}
      record_main: ${{ steps.kind.outputs.record_main }}
      carry: ${{ steps.carry.outputs.verdict }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      RUN_ID: ${{ github.run_id }}
      # Job-level env cannot read `runner.temp`; /tmp is the runner's.
      OUT: /tmp/e2e-livedit-plan
    steps:
      # Secrets cannot be referenced inside `if:` expressions; pipe into env.
      # Without the key (a fork, a fresh clone of the repo) the suite stays
      # dormant: the paid job is SKIPPED, not failed.
      - name: Secret check
        id: secret
        env:
          ANTHROPIC_API_KEY_E2E: ${{ secrets.ANTHROPIC_API_KEY_E2E }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY_E2E" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY_E2E secret not configured; skipping the e2e-livedit suite. Add the secret in repo Settings → Secrets and variables → Actions to enable it."
          fi

      # What kind of run this is. The release gate is a dispatch on
      # release-gate/<sha> whose commit IS <sha> (release-cut pushes that
      # branch); every other dispatch is a manual one.
      - name: Run kind
        id: kind
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          kind="dispatch"
          if [ "$EVENT" = "pull_request" ]; then kind="pr"
          elif [ "$REF" = "refs/heads/release-gate/$SHA" ]; then kind="release"; fi
          record_main=false
          if [ "$kind" = "release" ] || { [ "$kind" = "dispatch" ] && [ "$REF" = "refs/heads/main" ]; }; then record_main=true; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "record_main=$record_main" >> "$GITHUB_OUTPUT"
          echo "run kind: $kind (records main greens: $record_main)"

      # A label that is not `real-ai` / `real-ai-full` decides nothing new,
      # but its run still reports the required check on the PR head — and the
      # newest check run of that name is the one that counts. So it keeps the
      # verdict of the newest OTHER Real-AI check on this commit (waiting for
      # one still in flight): green or none → skip, red → blocked. Without
      # this, labelling a PR `bug` would turn a red Real-AI check green.
      - name: Unrelated label — keep the commit's verdict
        id: carry
        if: >-
          steps.secret.outputs.enabled == 'true' && github.event_name == 'pull_request' &&
          github.event.action == 'labeled' && github.event.label.name != 'real-ai' &&
          github.event.label.name != 'real-ai-full'
        env:
          LABEL: ${{ github.event.label.name }}
          JOB_NAME: Real-AI live-edit scenario
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 60 * 60 ))
          while :; do
            if runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$(jq -rn --arg n "$JOB_NAME" '$n|@uri')&per_page=100" --paginate \
                --jq ".check_runs[] | select((.html_url // \"\") | contains(\"/runs/$RUN_ID/\") | not) | [.id, .status, (.conclusion // \"\")] | @tsv"); then
              if ! awk -F'\t' '$2 != "completed"' <<<"$runs" | grep -q .; then
                latest=$(sort -n <<<"$runs" | tail -1)
                conclusion=$(cut -f3 <<<"$latest")
                case "$conclusion" in
                  "") verdict=skip; reason="label \`$LABEL\` does not opt in to Real-AI (no earlier Real-AI result on this commit)" ;;
                  success|skipped|neutral) verdict=skip; reason="label \`$LABEL\` does not opt in to Real-AI; the commit's previous Real-AI result ($conclusion) stands" ;;
                  *) verdict=blocked; reason="the previous Real-AI run on this commit ended '$conclusion' — adding label \`$LABEL\` does not clear it. Re-run that run, or push a fix." ;;
                esac
                { echo "verdict=$verdict"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              { echo "verdict=blocked"; echo "reason=could not read the commit's previous Real-AI result within 60 minutes — re-run this workflow."; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done

      - uses: actions/checkout@v7
        if: steps.secret.outputs.enabled == 'true' && steps.carry.outputs.verdict == ''

      - name: Setup Bun
        if: steps.secret.outputs.enabled == 'true' && steps.carry.outputs.verdict == ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # PR facts from the API, not the event payload: a re-run replays the
      # original payload, so draft state and labels would be stale.
      - name: Select scenarios
        id: select
        if: steps.secret.outputs.enabled == 'true' && steps.carry.outputs.verdict == ''
        env:
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/greens"
          if [ "$KIND" = "release" ]; then
            # The newest green per scenario on main (lib/main-greens.ts). A
            # listing that fails reads as "no greens": everything runs.
            gh api "repos/$REPO/contents/greens?ref=e2e-livedit-ledger" --jq '.[].name' > "$OUT/main-greens.txt" 2>/dev/null || : > "$OUT/main-greens.txt"
            # The green commits, so the planner can diff them against this
            # one. A commit that cannot be fetched cannot be diffed: its
            # scenarios run.
            for sha in $(sed -nE 's/^[a-z0-9-]+_[0-9]{8}T[0-9]{6}Z_([0-9a-f]{40})_.*/\1/p' "$OUT/main-greens.txt" | sort -u); do
              git fetch -q --no-tags --depth=1 origin "$sha" || echo "::warning::could not fetch green commit $sha; the scenarios green there run again"
            done
            bun run apps/admin/e2e-livedit/lib/main-greens.ts plan --names "$OUT/main-greens.txt" --out "$OUT/plan.json" > "$OUT/summary.md"
            cat "$OUT/summary.md"
            exit 0
          fi
          if [ "$KIND" = "dispatch" ]; then
            bun run apps/admin/e2e-livedit/lib/plan.ts plan --mode full --out "$OUT/plan.json" > "$OUT/summary.md"
            cat "$OUT/summary.md"
            exit 0
          fi
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if [ "$(jq -r .draft <<<"$pr")" = "true" ]; then
            echo "draft=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$pr")
          gh api "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$OUT/changed.txt"
          # Greens recorded by this PR's earlier runs (newest 15 completed).
          # Every run complete at this point is listed in the plan
          # (consultedRuns): the paid job treats a run of this commit that is
          # NOT listed as news that arrived while it waited (lib/plan.ts
          # replanAfterWait).
          gh api "repos/$REPO/actions/workflows/e2e-livedit.yml/runs?event=pull_request&branch=$HEAD_REF&per_page=50" \
            --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$HEAD_REPO\" and .id != $RUN_ID and .status == \"completed\")][] | .id" > "$OUT/consulted.txt"
          for id in $(head -n 15 "$OUT/consulted.txt"); do
            for aid in $(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("e2e-livedit-scenario-greens-"))) | .id'); do
              if gh api "repos/$REPO/actions/artifacts/$aid/zip" > "$OUT/$aid.zip"; then
                unzip -o -q "$OUT/$aid.zip" -d "$OUT/greens/$aid" || true
              fi
            done
          done
          bun run apps/admin/e2e-livedit/lib/plan.ts plan --mode pr --changed "$OUT/changed.txt" \
            --greens "$OUT/greens" --consulted "$OUT/consulted.txt" --labels "$labels" --out "$OUT/plan.json" \
            --comment "$OUT/opt-in-comment.md" > "$OUT/summary.md"
          cat "$OUT/summary.md"

      # Every kind of run counts toward the budget (the ledger records them
      # all); PR runs and manual dispatches are limited by it, the release
      # gate never is, and a dispatch with `override_budget` is not.
      - name: Weekly budget
        id: budget
        if: >-
          steps.secret.outputs.enabled == 'true' && steps.carry.outputs.verdict == '' &&
          steps.select.outputs.draft != 'true' && steps.kind.outputs.kind != 'release'
        env:
          BUDGET_USD: ${{ vars.E2E_LIVEDIT_WEEKLY_BUDGET_USD }}
        run: |
          set -euo pipefail
          # One directory listing of the ledger branch; a missing branch (no
          # run recorded yet) is zero spend.
          gh api "repos/$REPO/contents/runs?ref=e2e-livedit-ledger" --jq '.[].name' > "$OUT/ledger.txt" 2>/dev/null || : > "$OUT/ledger.txt"
          bun run apps/admin/e2e-livedit/lib/budget.ts spend --names "$OUT/ledger.txt" \
            --budget-usd "${BUDGET_USD:-}" --out "$OUT/budget.json"

      - name: Verdict, CI wait, stale check
        id: verdict
        if: always()
        env:
          ENABLED: ${{ steps.secret.outputs.enabled }}
          KIND: ${{ steps.kind.outputs.kind }}
          CARRY: ${{ steps.carry.outputs.verdict }}
          CARRY_REASON: ${{ steps.carry.outputs.reason }}
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
          DRAFT: ${{ steps.select.outputs.draft }}
          OVERRIDE_BUDGET: ${{ github.event.inputs.override_budget }}
          DISPATCH_REF: ${{ github.ref_name }}
          # The cheap CI checks the paid job waits for (ci.yml job names).
          WAIT_FOR: "Lockfile freshness|Lint, Typecheck, Migrate, Test, License|Admin production image — boot smoke"
        run: |
          set -uo pipefail
          emit() {
            {
              echo "mode=$1"
              echo "reason=$2"
              echo "scenarios=${3:-}"
              echo "full=${4:-false}"
              echo "paid=${5:-true}"
            } >> "$GITHUB_OUTPUT"
            echo "### Real-AI plan: $1" >> "$GITHUB_STEP_SUMMARY"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            [ -s "$OUT/summary.md" ] && cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
            if [ "$1" = "skip" ]; then echo "::notice title=Real-AI suite skipped::$2"; fi
            if [ "$1" = "blocked" ]; then echo "::error title=Real-AI suite blocked::$2"; fi
            exit 0
          }
          [ "$ENABLED" = "true" ] || emit skip "ANTHROPIC_API_KEY_E2E is not configured"
          [ -n "$CARRY" ] && emit "$CARRY" "$CARRY_REASON"
          [ "$DRAFT" = "true" ] && emit skip "draft PR — the suite runs once the PR is marked ready for review"
          [ "$SELECT_OUTCOME" = "success" ] || emit blocked "the scenario selection failed — see the plan job log; re-run the workflow"
          mode=$(jq -r .mode "$OUT/plan.json")
          reason=$(jq -r .reason "$OUT/plan.json")
          full=$(jq -r .full "$OUT/plan.json")
          scenarios=$(jq -r .scenarioFiles "$OUT/plan.json")
          # The release gate: never budget-limited, never waits for PR CI.
          # With every scenario carried over the paid job still RUNS (without
          # its paid steps), so release-cut reads a successful AI job.
          if [ "$KIND" = "release" ]; then
            paid=$(jq -r 'if .paid == false then "false" else "true" end' "$OUT/plan.json")
            emit run "$reason" "$scenarios" "$full" "$paid"
          fi
          if [ "$mode" = "skip" ]; then
            # Not opted in but AI-relevant: say what would run, and how.
            if [ "$KIND" = "pr" ] && [ -s "$OUT/opt-in-comment.md" ]; then
              bash apps/admin/e2e-livedit/lib/sticky-comment.sh "$PR_NUMBER" "$OUT/opt-in-comment.md" || true
            fi
            emit skip "$reason"
          fi
          if [ "$KIND" = "dispatch" ] && [ "$OVERRIDE_BUDGET" = "true" ]; then
            emit run "$reason (override_budget)" "$scenarios" "$full"
          fi

          [ "$BUDGET_OUTCOME" = "success" ] || emit blocked "the weekly budget could not be read — see the plan job log; re-run the workflow"
          line=$(jq -r .line "$OUT/budget.json")
          echo "$line" >> "$OUT/summary.md"
          if [ "$(jq -r .over "$OUT/budget.json")" = "true" ]; then
            if [ "$KIND" = "pr" ]; then
              printf '<!-- e2e-livedit-sticky -->\n## e2e-livedit — not run (weekly budget)\n\n%s\n\nThe check passes as skipped. A maintainer can run the suite with `gh workflow run e2e-livedit.yml --ref %s -f override_budget=true`, or raise the repo variable `E2E_LIVEDIT_WEEKLY_BUDGET_USD`.\n' \
                "$line" "$HEAD_REF" > "$OUT/comment.md"
              bash apps/admin/e2e-livedit/lib/sticky-comment.sh "$PR_NUMBER" "$OUT/comment.md" || true
            else
              emit skip "$line Dispatch again with override_budget=true to run anyway: gh workflow run e2e-livedit.yml --ref $DISPATCH_REF -f override_budget=true"
            fi
            emit skip "$line"
          fi
          if [ "$KIND" = "dispatch" ]; then emit run "$reason" "$scenarios" "$full"; fi

          # Wait for the cheap checks on the head commit. The newest run of
          # each name decides (a re-run supersedes an earlier attempt).
          deadline=$(( $(date +%s) + 65 * 60 ))
          IFS='|' read -r -a names <<<"$WAIT_FOR"
          while :; do
            if runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --paginate \
                --jq '.check_runs[] | [.id, .name, .status, (.conclusion // "")] | @tsv'); then
              pending=0; red=""
              for n in "${names[@]}"; do
                latest=$(awk -F'\t' -v n="$n" '$2 == n' <<<"$runs" | sort -n | tail -1)
                if [ -z "$latest" ]; then pending=1; continue; fi
                status=$(cut -f3 <<<"$latest"); conclusion=$(cut -f4 <<<"$latest")
                if [ "$status" != "completed" ]; then pending=1; continue; fi
                case "$conclusion" in
                  success|skipped|neutral) ;;
                  *) red="$red ${n} (${conclusion})" ;;
                esac
              done
              [ -n "$red" ] && emit blocked "CI is red on this commit:${red} — the Real-AI suite did not run. Fix CI, then re-run this workflow (Re-run all jobs)."
              [ "$pending" = "0" ] && break
            fi
            [ "$(date +%s)" -ge "$deadline" ] && emit blocked "the CI checks did not finish within 65 minutes — re-run this workflow once CI is done."
            sleep 30
          done

          # A newer push superseded this commit while CI ran: its own run
          # covers the PR; skip instead of paying for a stale commit.
          head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha 2>/dev/null || echo "$HEAD_SHA")
          [ "$head" != "$HEAD_SHA" ] && emit skip "superseded by ${head:0:7} — that commit's run covers the PR"
          emit run "$reason" "$scenarios" "$full"

      - name: Upload the plan
        if: always() && steps.verdict.outputs.mode == 'run'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-plan-${{ github.run_id }}
          path: /tmp/e2e-livedit-plan/
          if-no-files-found: error
          retention-days: 14

  e2e-livedit:
    name: Real-AI live-edit scenario
    needs: [plan]
    # `!cancelled()`, not `always()`: a failed plan job must still RUN this
    # job (its first step fails it — see the trigger block), while a run
    # cancelled as a whole must not start the paid work.
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'skip' }}
    runs-on: ubuntu-latest
    # Never cancel a paid run in flight: a cancelled run is already paid for
    # (15 were cancelled on 2026-10-26 alone). One job per PR runs; the
    # newest waiting one queues behind it and GitHub drops an older pending
    # one, so a burst of pushes costs at most the running job plus the last.
    concurrency:
      group: e2e-livedit-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    # The full chat → Stage → Publish → re-edit loop runs ~5 min per
    # scenario at Opus 4.7 plus compose spin-up + admin build. The
    # suite now runs 6 scenarios (the v0.12 PR added 5 — extract-
    # fields, nested-modules, content-library-shared-edit, placement-
    # sync-toggle, ai-nested-cta — on top of the pre-existing
    # homepage scenario), so the prior 20-min ceiling started timing
    # out runs that were genuinely working. 45 min covers the 6-
    # scenario worst case (~30 min run + ~10 min spin-up + buffer)
    # while still failing a stuck job in bounded time.
    # 65 since the quality-gate hang fix: the homepage scenario owns a
    # 25-min test budget and Playwright retries it once, so a first attempt
    # that legitimately fails at its budget plus a full-length retry is
    # ~50 min on top of ~3 min setup/build and ~6 min for the other
    # scenarios. At 45 such runs were CANCELLED (runs 38745512796,
    # 38746723795), which skips the failure-only diagnostics and loses the
    # retry's verdict; 65 lets every attempt report while a genuinely stuck
    # job still dies in bounded time.
    timeout-minutes: 65
    permissions:
      # `contents: write` is required for the "Push screenshots…" step
      # below — it pushes failure screenshots to the `screenshots/
      # e2e-livedit` orphan branch so the PR comment can embed them
      # via raw.githubusercontent.com. Fork PRs get a read-only token
      # regardless of this block (and the test is skipped on forks
      # anyway because the secret isn't injected into fork contexts),
      # so the write privilege is scoped to same-repo branches only.
      contents: write
      pull-requests: write
      # Read the plan artifact; cancel this run when its commit is stale.
      actions: write

    env:
      # Compose isolation — the existing `e2e` job in ci.yml may run
      # the same `caelo-postgres` container name on the same runner.
      # A unique project name per run prefixes the container + scopes
      # the network so the two suites can never collide.
      COMPOSE_PROJECT_NAME: caelo-e2e-livedit-${{ github.run_id }}
      POSTGRES_USER: caelo
      POSTGRES_PASSWORD: caelo_ci
      POSTGRES_DB: postgres
      # Host port 5433 to dodge the GHA Postgres service in ci.yml
      # which binds 5432. The compose Postgres still binds 5432
      # inside its network.
      POSTGRES_PORT: 5433
      ADMIN_ROLE_PASSWORD: caelo_admin_ci
      PUBLIC_ROLE_PASSWORD: caelo_public_ci
      ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5433/cms_admin
      PUBLIC_ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5433/cms_public
      PUBLIC_DATABASE_URL: postgres://public_role:caelo_public_ci@localhost:5433/cms_public
      STAGING_PORT: 8081
      PRODUCTION_PORT: 8082
      CAELO_STAGING_BASE_URL: http://localhost:8081
      CAELO_PRODUCTION_BASE_URL: http://localhost:8082

    steps:
      # The plan job's "must not merge" verdicts fail the required check here
      # (a skipped check would pass).
      - name: Guard — plan verdict
        id: guard
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error title=Real-AI plan failed::the plan job ended '$PLAN_RESULT', so nothing was selected — re-run the workflow."
            exit 1
          fi
          if [ "$MODE" != "run" ]; then
            echo "::error title=Real-AI suite not run::${REASON:-plan mode '$MODE'}"
            exit 1
          fi
          echo "::notice title=Real-AI plan::$REASON"

      # The job may have waited in the concurrency queue while the PR moved
      # on. A newer commit's run covers the PR, so this one stops before any
      # paid step. A self-cancel (not a failure, not a skip) leaves the stale
      # commit's check cancelled and the PR head untouched.
      - name: Guard — superseded commit
        id: stale
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) || exit 0
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::notice title=Real-AI suite superseded::the PR moved to ${head:0:7}; cancelling this run for ${HEAD_SHA:0:7} before any paid step."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            gh run cancel "$RUN_ID"
            sleep 300
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Fetch the plan
        uses: actions/download-artifact@v8
        with:
          name: e2e-livedit-plan-${{ github.run_id }}
          path: apps/admin/test-results/livedit/plan

      # Two runs can plan the same commit before either paid job finishes —
      # a push and a `real-ai-full` label seconds apart (PR #1182: runs
      # 40514501167 + 40514501647 both planned the full suite). The job-level
      # concurrency queues the second behind the first, and the plan's
      # per-scenario reuse was computed before that wait, so the second paid
      # for the identical commit again. Now that this job holds the slot,
      # read the paid jobs of the OTHER runs of this commit that finished
      # after the plan looked (plan.json consultedRuns) — lib/plan.ts
      # replanAfterWait decides:
      #   - one ran paid work and ended red → this job FAILS: its failures
      #     stand for the commit; a duplicate must not re-roll them green
      #     (re-run that run instead — a job blocked here never counts as a
      #     verdict, so that re-run is not blocked in turn);
      #   - their greens carry over; nothing left to run → no paid step and a
      #     passing, annotated check (what a plan whose every scenario is
      #     already green gives), otherwise only the rest runs.
      # A listing that cannot be read changes nothing (warns; the run pays
      # as before this guard existed).
      - name: Guard — results recorded while this run waited
        id: dedupe
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_NAME: Real-AI live-edit scenario
          # A job counts as a verdict only when it reached this step: one
          # that failed before it (blocked by its plan, or by this guard
          # echoing another run's red) says nothing of its own.
          PREFLIGHT_STEP: AI provider preflight (fail fast)
          PLAN_DIR: apps/admin/test-results/livedit/plan
        run: |
          set -uo pipefail
          dir=$(mktemp -d)
          mkdir -p "$dir/greens"
          : > "$dir/jobs.tsv"
          if ! ids=$(gh api "repos/$REPO/actions/workflows/e2e-livedit.yml/runs?event=pull_request&head_sha=$HEAD_SHA&per_page=100" \
              --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id"); then
            echo "::warning title=Real-AI duplicate check::could not list the other runs of ${HEAD_SHA:0:7}; running the plan as it stands."
            exit 0
          fi
          for id in $ids; do
            if ! job=$(gh api "repos/$REPO/actions/runs/$id/jobs?filter=latest&per_page=100" \
                --jq ".jobs[] | select(.name == \"$JOB_NAME\") | [.status, (.conclusion // \"\"), ([.steps[]? | select(.name == \"$PREFLIGHT_STEP\") | (.conclusion // \"\")] | first // \"\")] | @tsv"); then
              echo "::warning title=Real-AI duplicate check::could not read run $id; running the plan as it stands."
              exit 0
            fi
            [ -n "$job" ] || continue
            printf '%s\t%s\n' "$id" "$job" >> "$dir/jobs.tsv"
            # Greens only from a green job the plan did not consult.
            [ "$(cut -f1,2 <<<"$job")" = "$(printf 'completed\tsuccess')" ] || continue
            jq -e --argjson id "$id" '(.consultedRuns // []) | index($id) != null' "$PLAN_DIR/plan.json" > /dev/null && continue
            for aid in $(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("e2e-livedit-scenario-greens-"))) | .id'); do
              if gh api "repos/$REPO/actions/artifacts/$aid/zip" > "$dir/$aid.zip"; then
                unzip -o -q "$dir/$aid.zip" -d "$dir/greens/$aid" || true
              fi
            done
          done
          if ! v=$(bun run apps/admin/e2e-livedit/lib/plan.ts after-wait --plan "$PLAN_DIR/plan.json" \
              --jobs "$dir/jobs.tsv" --greens "$dir/greens" --out "$PLAN_DIR/plan.json" \
              --summary "$PLAN_DIR/summary.md"); then
            echo "::error title=Real-AI duplicate check::re-planning after the wait failed — see the log; re-run the workflow."
            exit 1
          fi
          verdict=$(jq -r .verdict <<<"$v")
          reason=$(jq -r .reason <<<"$v")
          dropped=$(jq -r '.dropped | length > 0' <<<"$v")
          {
            echo "verdict=$verdict"
            echo "dropped=$dropped"
            echo "scenarios=$(jq -r .scenarios <<<"$v")"
          } >> "$GITHUB_OUTPUT"
          case "$verdict" in
            blocked)
              { echo "### Real-AI suite not run: earlier run on this commit"; echo "$reason"; } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Real-AI suite blocked::$reason"
              exit 1 ;;
            stop)
              {
                echo "### Real-AI suite: nothing left to run"
                cat "$PLAN_DIR/summary.md" 2>/dev/null || true
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Real-AI suite carried over::$reason"
              echo "stop=true" >> "$GITHUB_OUTPUT" ;;
            *)
              if [ "$dropped" = "true" ]; then echo "::notice title=Real-AI plan narrowed::$reason"; fi ;;
          esac

      # The last stop before paid work. (0) The duplicate check above left
      # nothing to run: stop, green. (1) A release gate whose scenarios
      # all carried over (plan output `paid` false) ends here, green: the
      # greens it rests on are newer than 7 days and nothing they cover
      # changed. (2) The plan read the budget before its CI wait (up to 65
      # min), and this job may have queued behind another paid run of the PR
      # since; other runs can have spent the rest of the week meanwhile. Re-
      # read the ledger right before the first paid step and stop with a
      # passing, annotated check when it is used up — the same verdict the
      # plan gives. The release gate and a dispatch with `override_budget`
      # are exempt.
      - name: Guard — paid work (nothing to run, weekly budget re-read)
        id: paid
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BUDGET_USD: ${{ vars.E2E_LIVEDIT_WEEKLY_BUDGET_USD }}
          KIND: ${{ needs.plan.outputs.kind }}
          PAID: ${{ needs.plan.outputs.paid }}
          OVERRIDE_BUDGET: ${{ github.event.inputs.override_budget }}
          DEDUPE_STOP: ${{ steps.dedupe.outputs.stop }}
        run: |
          set -euo pipefail
          if [ "$DEDUPE_STOP" = "true" ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PAID" = "false" ]; then
            {
              echo "### Real-AI suite: nothing to run"
              cat apps/admin/test-results/livedit/plan/summary.md 2>/dev/null || true
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Real-AI suite carried over::every scenario is green on main within 7 days and nothing it covers changed since."
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$KIND" = "release" ]; then exit 0; fi
          if [ "$KIND" = "dispatch" ] && [ "$OVERRIDE_BUDGET" = "true" ]; then exit 0; fi
          dir=$(mktemp -d)
          gh api "repos/$REPO/contents/runs?ref=e2e-livedit-ledger" --jq '.[].name' > "$dir/ledger.txt" 2>/dev/null || : > "$dir/ledger.txt"
          bun run apps/admin/e2e-livedit/lib/budget.ts spend --names "$dir/ledger.txt" \
            --budget-usd "${BUDGET_USD:-}" --out "$dir/budget.json"
          line=$(jq -r .line "$dir/budget.json")
          if [ "$(jq -r .over "$dir/budget.json")" = "true" ]; then
            if [ "$KIND" = "pr" ]; then
              printf '<!-- e2e-livedit-sticky -->\n## e2e-livedit — not run (weekly budget)\n\n%s\n\nThe budget ran out while this run waited for CI or for the previous paid run of this PR. The check passes as skipped. A maintainer can run the suite with `gh workflow run e2e-livedit.yml --ref %s -f override_budget=true`, or raise the repo variable `E2E_LIVEDIT_WEEKLY_BUDGET_USD`.\n' \
                "$line" "$HEAD_REF" > "$dir/comment.md"
              bash apps/admin/e2e-livedit/lib/sticky-comment.sh "$PR_NUMBER" "$dir/comment.md" || true
            fi
            { echo "### Real-AI suite not run: weekly budget"; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Real-AI suite skipped::$line"
            echo "stop=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail fast when the provider refuses the CI key (spending/usage limit,
      # invalid key, permission) — one `max_tokens: 1` call on the cheapest
      # catalog model before compose, build and the scenarios. Without it a
      # capped account made every scenario fail on an unrelated-looking
      # assertion or a 6-minute Stage timeout (run 38455081117). Overloaded /
      # 5xx answers are retried with backoff, then reported as "provider
      # unavailable". The provider's message goes to the step summary, an
      # `::error::` and the PR comment (via the report file); the key is
      # never printed. Needs no `bun install`: the script uses fetch + node
      # builtins only.
      - name: AI provider preflight (fail fast)
        if: steps.paid.outputs.stop != 'true'
        id: provider-preflight
        env:
          ANTHROPIC_API_KEY_E2E: ${{ secrets.ANTHROPIC_API_KEY_E2E }}
        run: bun scripts/ai-provider-preflight.ts --report apps/admin/test-results/livedit/provider-preflight.md

      - name: Install dependencies (frozen lockfile)
        if: steps.paid.outputs.stop != 'true'
        run: bun install --frozen-lockfile

      # Materialise the .env compose reads its POSTGRES_USER/PASSWORD
      # from. Compose's `env_file: .env` directive is mandatory in
      # docker-compose.yml; skipping the write makes Postgres start
      # with no roles.
      - name: Write compose .env
        if: steps.paid.outputs.stop != 'true'
        run: |
          cat > .env <<EOF
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          ADMIN_ROLE_PASSWORD=${ADMIN_ROLE_PASSWORD}
          PUBLIC_ROLE_PASSWORD=${PUBLIC_ROLE_PASSWORD}
          POSTGRES_PORT=${POSTGRES_PORT}
          STAGING_PORT=${STAGING_PORT}
          PRODUCTION_PORT=${PRODUCTION_PORT}
          EOF

      # Pre-create the static-gen output dirs the Caddy services
      # bind-mount. Without this, Docker creates them at compose-up
      # as root-owned empty dirs, blocking the host-side admin
      # process (running as the runner's user) from writing the
      # generated files.
      - name: Pre-create static-gen output dirs
        if: steps.paid.outputs.stop != 'true'
        run: mkdir -p apps/admin/output/staging apps/admin/output/production

      - name: Start compose (postgres + caddy-staging + caddy-production)
        if: steps.paid.outputs.stop != 'true'
        # `wait` blocks until each service's healthcheck reports healthy.
        # postgres has a healthcheck; the caddy services don't, but
        # they come up in <1s so the wait is effectively just for pg.
        run: docker compose up -d --wait

      - name: Run migrations
        if: steps.paid.outputs.stop != 'true'
        env:
          PGHOST: localhost
        run: bun run db:migrate

      # `@caelo-cms/shared` and `@caelo-cms/mcp-server` (the remote MCP
      # surfaces, #806) ship a compiled dist/ — the admin's SSR build can't
      # resolve them otherwise. Same #36/#51 lesson as the `e2e` job in
      # ci.yml.
      - name: Build @caelo-cms/shared + mcp-server (admin SSR deps)
        if: steps.paid.outputs.stop != 'true'
        run: |
          bun run --filter '@caelo-cms/shared' build
          bun run --filter '@caelo-cms/mcp-server' build

      - name: Install Playwright chromium
        if: steps.paid.outputs.stop != 'true'
        # #984 - apt fonts from actions/cache, not the Ubuntu mirror.
        uses: ./.github/actions/playwright-chromium

      # Token/loop regression guards (issue #432): the per-scenario ceilings
      # this step gates on live in `apps/admin/e2e-livedit/lib/metrics-core.ts`
      # THRESHOLDS: new input (cache writes + uncached) <= 300k and loops
      # <= 26 for the homepage, re-derived 2026-10-26 (rationale at the
      # constant). No Playwright retry: a breach fails this step.
      - name: Run e2e-livedit (Scenario 1)
        if: steps.paid.outputs.stop != 'true'
        id: suite
        env:
          # The planner's selection (comma-separated spec files); empty runs
          # every spec. playwright.livedit.config.ts validates it. The
          # duplicate check's narrowed list wins when it dropped scenarios
          # (then it is never empty).
          CAELO_LIVEDIT_SCENARIOS: ${{ steps.dedupe.outputs.scenarios || needs.plan.outputs.scenarios }}
          ANTHROPIC_API_KEY_E2E: ${{ secrets.ANTHROPIC_API_KEY_E2E }}
          # Optional: enables scenario-image-gen (real Nano Banana image
          # generation). Absent ⇒ that scenario skips itself. Add the secret
          # in repo Settings → Secrets and variables → Actions to enable it.
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          # Epic #901 — the test admin forwards every AI bug report to the
          # Caelo bug intake, which files (or joins) its GitHub issue; the
          # bug gate below blocks only more than 5 new reports.
          CAELO_E2E_FORWARD_BUGS: "1"
        run: bun run e2e-livedit

      # Capture the REAL AI cost of this run from `ai_calls` (operator ask
      # — a per-run cost that can serve as an optimization metric over
      # time). The compose Postgres stays up until the final teardown, so
      # any post-run position works. Every ai_calls row belongs to THIS
      # run (the DB is fresh per job — migrated then seeded+driven by the
      # suite), so no date filter is needed. `unpricedCalls` flags the
      # #297 signature — a missing `ai_pricing` row zeroing an otherwise
      # token-heavy call, which UNDERSTATES the real cost. RLS on
      # `ai_calls` is FORCEd behind a non-empty `caelo.actor_kind` GUC, so
      # we `SET` it in the same session before selecting. `-q` suppresses
      # the `SET` command tag so stdout is pure JSON. `if: always()` so a
      # red suite still records its spend. Never fails the job.
      - name: Capture real AI cost from ai_calls
        if: always() && steps.provider-preflight.outcome == 'success'
        env:
          PGHOST: localhost
        run: |
          set -uo pipefail
          OUT_DIR=apps/admin/test-results/livedit
          OUT="${OUT_DIR}/ai-cost.json"
          mkdir -p "${OUT_DIR}"
          PGPASSWORD=${ADMIN_ROLE_PASSWORD} \
            psql "${ADMIN_DATABASE_URL}" -qAtc \
            "SET caelo.actor_kind='system'; SELECT json_build_object('totalMicrocents', COALESCE(SUM(cost_estimate_microcents),0), 'calls', COUNT(*), 'inputTokens', COALESCE(SUM(input_tokens),0), 'outputTokens', COALESCE(SUM(output_tokens),0), 'cachedTokens', COALESCE(SUM(cached_tokens),0), 'unpricedCalls', COUNT(*) FILTER (WHERE cost_estimate_microcents=0 AND (input_tokens>0 OR output_tokens>0)), 'byModel', COALESCE((SELECT json_agg(m) FROM (SELECT model, COUNT(*) AS calls, SUM(cost_estimate_microcents) AS microcents FROM ai_calls GROUP BY model ORDER BY SUM(cost_estimate_microcents) DESC) m), '[]'::json)) FROM ai_calls" \
            > "${OUT}" 2>/dev/null || echo '{}' > "${OUT}"
          # Guard: an empty/whitespace file is as useless as a missing one.
          if [ ! -s "${OUT}" ]; then echo '{}' > "${OUT}"; fi
          echo "ai-cost.json:"; cat "${OUT}"; echo

          # Durable, greppable per-run metric — a future scraper can walk
          # run summaries for `e2e-livedit-cost` to chart spend over time.
          MICRO=$(jq -r '.totalMicrocents // 0' "${OUT}" 2>/dev/null || echo 0)
          CALLS=$(jq -r '.calls // 0' "${OUT}" 2>/dev/null || echo 0)
          TIN=$(jq -r '.inputTokens // 0' "${OUT}" 2>/dev/null || echo 0)
          TOUT=$(jq -r '.outputTokens // 0' "${OUT}" 2>/dev/null || echo 0)
          UNPRICED=$(jq -r '.unpricedCalls // 0' "${OUT}" 2>/dev/null || echo 0)
          USD=$(awk -v m="${MICRO}" 'BEGIN { printf "%.4f", m/100000000 }')
          {
            echo '```'
            echo "e2e-livedit-cost totalUsd=${USD} calls=${CALLS} tokensIn=${TIN} tokensOut=${TOUT} unpriced=${UNPRICED} sha=${GITHUB_SHA}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=e2e-livedit cost::\$${USD} (${CALLS} calls)"
          if [ "${UNPRICED}" != "0" ]; then
            echo "::warning title=e2e-livedit cost::${UNPRICED} unpriced ai_calls row(s) — real cost is HIGHER than \$${USD}; add ai_pricing rates."
          fi

      # Weekly budget ledger (lib/budget.ts): one file per run attempt on the
      # `e2e-livedit-ledger` branch, named <time>_<run>-<attempt>_<microcents>
      # .json, so the plan job reads the week's spend from one directory
      # listing. Every kind of run records here — PR, release gate, manual
      # dispatch — so the budget sees all spend. Entries older than 9 days
      # are pruned in the same commit (lib/ledger-commit.sh). Never fails the
      # job; a lost entry under-counts the week, so it warns.
      - name: Record the run's cost in the budget ledger
        if: always() && steps.provider-preflight.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          COST="${GITHUB_WORKSPACE}/apps/admin/test-results/livedit/ai-cost.json"
          if ! name=$(bun run apps/admin/e2e-livedit/lib/budget.ts name --cost "$COST" --run "$RUN_ID" --attempt "$ATTEMPT"); then
            echo "::warning title=Real-AI budget ledger::could not read ${COST}; this run's spend is missing from the weekly budget."
            exit 0
          fi
          src="$RUNNER_TEMP/ledger-cost"
          rm -rf "$src" && mkdir -p "$src/runs" && cp "$COST" "$src/runs/$name"
          if bash apps/admin/e2e-livedit/lib/ledger-commit.sh "ledger: run ${RUN_ID} attempt ${ATTEMPT}" "$src"; then
            echo "recorded ${name} on e2e-livedit-ledger"
          else
            echo "::warning title=Real-AI budget ledger::could not push ${name} to e2e-livedit-ledger after 5 attempts; this run's spend is missing from the weekly budget."
          fi

      # Every defect filed during the run, from `ai_bug_reports`: the model's
      # own `bug_report` tool calls (source 'ai') plus the chat-runner's
      # auto-capture of failed tool results and turn-fatal provider errors
      # (source 'auto'). This is the signal the pass/fail verdict cannot
      # carry — a GREEN run whose bug count rose means the AI routed AROUND
      # a defect instead of failing on it.
      #
      # No date or session filter, for the same reason the cost capture
      # above needs none: the DB is fresh per job, so every row belongs to
      # this run. (Locally, global-setup wipes the table at suite start to
      # get the same property.) Do not "fix" this by adding a window.
      #
      # No ORDER BY either — sorting lives in build-stats.ts where it is
      # unit-testable. Full `evidence` is dumped untruncated so the uploaded
      # artifact is complete; the PR comment does its own truncation.
      #
      # RLS is FORCEd behind a non-empty `caelo.actor_kind` GUC, so we SET
      # it in the same session. `-q` suppresses the SET command tag so
      # stdout is pure JSON. `if: always()` so a red suite still reports.
      # This step never fails the job; the gate step below does.
      - name: Capture AI-detected bugs from ai_bug_reports
        if: always() && steps.provider-preflight.outcome == 'success'
        env:
          PGHOST: localhost
        run: |
          set -uo pipefail
          OUT_DIR=apps/admin/test-results/livedit
          OUT="${OUT_DIR}/bug-reports.json"
          mkdir -p "${OUT_DIR}"
          PGPASSWORD=${ADMIN_ROLE_PASSWORD} \
            psql "${ADMIN_DATABASE_URL}" -qAtc \
            "SET caelo.actor_kind='system'; SELECT COALESCE(json_agg(json_build_object('id', id::text, 'createdAt', created_at::text, 'chatSessionId', chat_session_id::text, 'title', title, 'whatHappened', what_happened, 'expected', expected, 'suspectedTool', suspected_tool, 'evidence', evidence, 'severity', severity, 'blockedTask', blocked_task, 'status', status, 'source', source, 'forwardingState', forwarding_state, 'upstreamIssueUrl', upstream_issue_url, 'forwardError', forward_error)), '[]'::json) FROM ai_bug_reports" \
            > "${OUT}" 2>/dev/null || echo '{}' > "${OUT}"
          # An empty/whitespace file is as useless as a missing one. The `{}`
          # sentinel is deliberately NOT an array — build-stats.ts reads that
          # as "capture failed" and omits the section, which must stay
          # distinguishable from a real `[]` ("ran, found nothing").
          if [ ! -s "${OUT}" ]; then echo '{}' > "${OUT}"; fi
          echo "bug-reports.json:"; head -c 2000 "${OUT}"; echo

          TOTAL=$(jq -r 'if type=="array" then length else 0 end' "${OUT}" 2>/dev/null || echo 0)
          BLOCKING=$(jq -r 'if type=="array" then [.[]|select(.severity=="blocking")]|length else 0 end' "${OUT}" 2>/dev/null || echo 0)
          DEGRADED=$(jq -r 'if type=="array" then [.[]|select(.severity=="degraded")]|length else 0 end' "${OUT}" 2>/dev/null || echo 0)
          COSMETIC=$(jq -r 'if type=="array" then [.[]|select(.severity=="cosmetic")]|length else 0 end' "${OUT}" 2>/dev/null || echo 0)
          AI_FILED=$(jq -r 'if type=="array" then [.[]|select(.source=="ai")]|length else 0 end' "${OUT}" 2>/dev/null || echo 0)
          AUTO_FILED=$(jq -r 'if type=="array" then [.[]|select(.source=="auto")]|length else 0 end' "${OUT}" 2>/dev/null || echo 0)
          # Durable, greppable per-run metric, mirroring `e2e-livedit-cost`:
          # a scraper can walk run summaries to chart defect count over time.
          {
            echo '```'
            echo "e2e-livedit-bugs total=${TOTAL} blocking=${BLOCKING} degraded=${DEGRADED} cosmetic=${COSMETIC} ai=${AI_FILED} auto=${AUTO_FILED} sha=${GITHUB_SHA}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice title=e2e-livedit bugs::${TOTAL} detected (${BLOCKING} blocking, ${AI_FILED} AI-filed)"
          if [ "${BLOCKING}" != "0" ]; then
            echo "::warning title=e2e-livedit bugs::${BLOCKING} blocking bug report(s) filed during this run — see the PR comment's Detected bugs table."
          fi

      # Detected-bug gate. A tool error the AI had to recover from is our
      # defect (CLAUDE.md §1A/§4). Each new report was forwarded to the bug
      # intake during the run, which files its issue; the gate lists them
      # with that issue and fails only on more than 5 new reports
      # (MAX_NEW_BUGS in lib/bug-gate.ts). Runs after the capture above and
      # before the always() uploads + PR comment, which still run on failure.
      - name: Gate on new detected bugs
        id: bug-gate
        if: always() && steps.provider-preflight.outcome == 'success'
        run: bun run apps/admin/e2e-livedit/lib/bug-gate.ts

      # Per-scenario reuse (lib/plan.ts): the scenarios this run passed, plus
      # the ones it carried, each with the key of the inputs it passed on. A
      # later push of the same PR keeps a scenario whose key is unchanged.
      # Recorded even when another scenario failed — that is what lets the
      # next push re-run only what was red — but never when the run-level bug
      # gate failed (the bugs cannot be pinned to one scenario).
      - name: Record per-scenario results
        id: greens
        if: always() && steps.suite.outcome != 'skipped' && steps.bug-gate.outcome == 'success'
        run: |
          bun run apps/admin/e2e-livedit/lib/plan.ts record \
            --plan apps/admin/test-results/livedit/plan/plan.json \
            --report apps/admin/test-results/livedit/playwright-report.json \
            --out "$RUNNER_TEMP/scenario-greens.json"
      - name: Upload per-scenario results
        if: always() && steps.greens.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-scenario-greens-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scenario-greens.json
          if-no-files-found: error
          retention-days: 30

      # Release-gate reuse (lib/main-greens.ts): every scenario a release gate
      # or a dispatch on main RAN and passed is recorded on the ledger branch
      # with this commit, so the next gate re-runs it only when a file it
      # covers changed since (or the green is older than 7 days). Same
      # condition as the per-scenario record above: past the bug gate.
      # Carried scenarios keep their original record. A lost record only
      # costs a re-run, so a failed push warns.
      - name: Record main greens in the ledger (release gate / dispatch on main)
        id: main-greens
        if: always() && steps.greens.outcome == 'success' && needs.plan.outputs.record_main == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          src="$RUNNER_TEMP/ledger-greens"
          rm -rf "$src" && mkdir -p "$src"
          bun run apps/admin/e2e-livedit/lib/main-greens.ts record \
            --plan apps/admin/test-results/livedit/plan/plan.json \
            --report apps/admin/test-results/livedit/playwright-report.json \
            --sha "$GITHUB_SHA" --run "$RUN_ID" --attempt "$ATTEMPT" --dir "$src" || exit 0
          [ -n "$(ls -A "$src/greens" 2>/dev/null)" ] || exit 0
          bash apps/admin/e2e-livedit/lib/ledger-commit.sh "greens: run ${RUN_ID} attempt ${ATTEMPT} @ ${GITHUB_SHA::7}" "$src" \
            || echo "::warning title=Real-AI main greens::could not push this run's greens; the next release gate re-runs those scenarios."

      # release-cut reuses this run for main when main's tree is exactly the
      # tree tested here, instead of paying for the same suite twice. A PR
      # run tests the merge of the PR into main, and squash-merging a PR
      # that is up to date with main produces that same tree. The artifact
      # name carries the tree hash so release-cut finds it by name; it is
      # written only when every step above succeeded AND every CI scenario
      # ran in this job (`full`) — a partial PR run proves nothing about the
      # scenarios it did not run.
      - name: Record the tested tree (green only)
        id: green-tree
        if: success() && needs.plan.outputs.full == 'true' && steps.dedupe.outputs.dropped != 'true' && steps.suite.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/green-tree"
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "$tree" > "$RUNNER_TEMP/green-tree/tree.txt"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload the tested tree (green only)
        if: success() && needs.plan.outputs.full == 'true' && steps.dedupe.outputs.dropped != 'true' && steps.suite.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-green-tree-${{ steps.green-tree.outputs.tree }}
          path: ${{ runner.temp }}/green-tree/tree.txt
          if-no-files-found: error
          retention-days: 30

      # Durable per-run cost record — the trend metric the operator wants.
      # Separate from the failure-only artifact below: this uploads on
      # every run (green + red) so the metric series has no gaps.
      - name: Upload AI cost metric (always)
        if: always() && steps.provider-preflight.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-cost-${{ github.run_id }}
          path: apps/admin/test-results/livedit/ai-cost.json
          if-no-files-found: warn
          retention-days: 90

      # Same always-upload rationale as the cost metric: the failure-only
      # bundle below never runs on a green suite, and a green run that filed
      # bugs is exactly the case worth keeping. Kept as its own artifact
      # rather than folded into the cost one so `e2e-livedit-cost-<run_id>`
      # keeps its name for anything already scraping that series.
      - name: Upload detected-bugs metric (always)
        if: always() && steps.provider-preflight.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-bugs-${{ github.run_id }}
          path: apps/admin/test-results/livedit/bug-reports.json
          if-no-files-found: warn
          retention-days: 90

      # issue #161 — computed-style design probes + the non-blocking
      # AI-judge rubric scores (design-probe.ts), uploaded on every run so
      # the score trend has no gaps before the judge is promoted to a gate.
      - name: Upload design report (always)
        if: always() && steps.provider-preflight.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-design-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/admin/test-results/livedit/design-report.jsonl
          if-no-files-found: warn
          retention-days: 90

      # The chat transcripts every scenario reset writes (helpers.ts
      # dumpChatTranscripts), uploaded on EVERY run: a scenario that failed
      # its first attempt and passed the retry ("flaky") leaves the job
      # green, so the failure-only bundle below never carries the failed
      # attempt's turn — and a flake is a bug to root-cause (CLAUDE.md §4).
      - name: Upload chat transcripts (always)
        if: always() && steps.provider-preflight.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-transcripts-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/admin/test-results/livedit/transcripts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump diagnostic DB tables on failure
        if: failure() && steps.provider-preflight.outcome == 'success'
        env:
          PGHOST: localhost
        run: |
          mkdir -p apps/admin/test-results/livedit/db-dump
          for table in chat_messages chat_entity_locks pages page_modules page_module_content; do
            PGPASSWORD=${ADMIN_ROLE_PASSWORD} \
              psql "${ADMIN_DATABASE_URL}" \
              -c "\\COPY (SELECT * FROM ${table}) TO STDOUT WITH CSV HEADER" \
              > apps/admin/test-results/livedit/db-dump/${table}.csv 2>/dev/null || true
          done

      # Dump a directory listing of the static-gen output dirs so we
      # can diagnose publish-side issues (e.g. why production/current
      # is empty) post-hoc. Cheap; no actual files included in the
      # listing — just `find` output. The full output dirs aren't
      # uploaded because they can be sizeable and contain the same
      # HTML the test already exercises via the production fetch.
      - name: Dump static-gen output dir listings on failure
        if: failure() && steps.provider-preflight.outcome == 'success'
        run: |
          mkdir -p apps/admin/test-results/livedit/output-listing
          {
            echo "=== staging ===" ;
            find apps/admin/output/staging -maxdepth 5 -printf '%p (%s bytes)\n' 2>/dev/null || true ;
            echo "" ;
            echo "=== production ===" ;
            find apps/admin/output/production -maxdepth 5 -printf '%p (%s bytes)\n' 2>/dev/null || true ;
          } > apps/admin/test-results/livedit/output-listing/find-output.txt
          {
            echo "=== production/current/routing-manifest.json ===" ;
            cat apps/admin/output/production/current/routing-manifest.json 2>/dev/null || echo "(not found)" ;
            echo "" ;
            echo "=== production/current/index.html (first 1000 chars) ===" ;
            head -c 1000 apps/admin/output/production/current/index.html 2>/dev/null || echo "(not found)" ;
          } > apps/admin/test-results/livedit/output-listing/production-current.txt

      - name: Upload artifacts on failure
        if: failure() && steps.provider-preflight.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-livedit-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/admin/test-results/livedit/
          if-no-files-found: warn
          retention-days: 14

      # Push screenshots to a long-lived orphan branch so the PR
      # comment can embed them inline via raw.githubusercontent.com.
      # Collects shots from two sources:
      #   - playwright-report/data/*.png — Playwright's failure
      #     screenshots (one per failing attempt, hashed filename).
      #   - final-state/*.png — explicit page.screenshot() calls
      #     scenarios make at end-of-test, embedded on passing runs.
      # Runs always() so green runs replace the prior sticky comment
      # with their final-state shot.
      # The guard fails before the checkout, and the comment below needs
      # lib/sticky-comment.sh.
      - name: Checkout the comment script (plan said not to run)
        if: failure() && github.event_name == 'pull_request' && steps.guard.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          sparse-checkout: apps/admin/e2e-livedit/lib

      - name: Push screenshots to side branch and post PR comment
        if: always() && github.event_name == 'pull_request' && steps.paid.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.provider-preflight.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          SUPERSEDED: ${{ steps.stale.outputs.superseded }}
          PLAN_REASON: ${{ needs.plan.outputs.reason }}
          CARRY: ${{ needs.plan.outputs.carry }}
          DEDUPE: ${{ steps.dedupe.outputs.verdict }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # A superseded run cancelled itself: the newer commit's run owns
          # the comment.
          if [ "$SUPERSEDED" = "true" ]; then exit 0; fi

          # An unrelated label kept the commit's red verdict: the comment of
          # the run that produced it (screenshots, errors) stays.
          if [ -n "$CARRY" ]; then exit 0; fi

          # A run of this commit that finished red while this one waited
          # keeps its verdict — and its comment.
          if [ "$DEDUPE" = "blocked" ]; then exit 0; fi

          # The plan said "do not run" (CI red, plan failed): say why.
          if [ "$GUARD_OUTCOME" = "failure" ]; then
            printf '## e2e-livedit run [%s](https://github.com/%s/actions/runs/%s) — not run\n\n%s\n' \
              "$RUN_ID" "$REPO" "$RUN_ID" "${PLAN_REASON:-The plan job failed; see the run log.}" > /tmp/e2e-livedit-comment.md
            bash "$GITHUB_WORKSPACE/apps/admin/e2e-livedit/lib/sticky-comment.sh" "$PR_NUMBER" /tmp/e2e-livedit-comment.md
            exit 0
          fi

          # The provider preflight failed: no scenario ran, so there are no
          # screenshots or stats — post the provider's answer instead, so the
          # PR shows the real cause rather than a wall of downstream failures.
          PREFLIGHT_REPORT="apps/admin/test-results/livedit/provider-preflight.md"
          PLAN_SUMMARY="${GITHUB_WORKSPACE}/apps/admin/test-results/livedit/plan/summary.md"
          if [ "$PREFLIGHT_OUTCOME" = "failure" ]; then
            {
              printf '## e2e-livedit run [%s](https://github.com/%s/actions/runs/%s) — %s\n\n' \
                "$RUN_ID" "$REPO" "$RUN_ID" "$JOB_STATUS"
              if [ -s "$PREFLIGHT_REPORT" ]; then
                cat "$PREFLIGHT_REPORT"
              else
                printf 'The AI provider preflight failed before any scenario ran; see the run log.\n'
              fi
            } > /tmp/e2e-livedit-comment.md
            bash "$GITHUB_WORKSPACE/apps/admin/e2e-livedit/lib/sticky-comment.sh" "$PR_NUMBER" /tmp/e2e-livedit-comment.md
            exit 0
          fi

          FAIL_DIR="apps/admin/test-results/livedit/playwright-report/data"
          FINAL_DIR="apps/admin/test-results/livedit/final-state"
          BRANCH="screenshots/e2e-livedit"
          DEST_REL="pr-${PR_NUMBER}/run-${RUN_ID}"

          FAIL_SHOTS=("${GITHUB_WORKSPACE}/${FAIL_DIR}"/*.png)
          FINAL_SHOTS=("${GITHUB_WORKSPACE}/${FINAL_DIR}"/*.png)

          # Defensive fallback — only fires if both dirs are empty
          # (e.g. the test step never ran). Healthy passing runs always
          # emit a final-state shot; healthy failing runs emit attempt
          # shots; both populate at least one of the two dirs.
          if [ ${#FAIL_SHOTS[@]} -eq 0 ] && [ ${#FINAL_SHOTS[@]} -eq 0 ]; then
            printf '## e2e-livedit run [%s](https://github.com/%s/actions/runs/%s) — %s\n\nNo screenshots were produced.\n' \
              "$RUN_ID" "$REPO" "$RUN_ID" "$JOB_STATUS" > /tmp/e2e-livedit-comment.md
            bash "$GITHUB_WORKSPACE/apps/admin/e2e-livedit/lib/sticky-comment.sh" "$PR_NUMBER" /tmp/e2e-livedit-comment.md
            exit 0
          fi

          # Push screenshots to the orphan branch. Clone-fresh into a
          # tmp dir so we don't disturb the runner's working tree.
          mkdir -p /tmp/screenshots-wt
          cd /tmp/screenshots-wt

          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          if git fetch -q origin "$BRANCH" 2>/dev/null; then
            git checkout -q "$BRANCH"
          else
            git checkout -q --orphan "$BRANCH"
            git rm -rfq . 2>/dev/null || true
            printf 'e2e-livedit screenshots — see workflow .github/workflows/e2e-livedit.yml for layout.\n' > README.md
            git add README.md
            git commit -qm "Initialize e2e-livedit screenshots branch"
          fi

          mkdir -p "${DEST_REL}/failure" "${DEST_REL}/final-state"
          for src in "${FAIL_SHOTS[@]}"; do
            cp "$src" "${DEST_REL}/failure/"
          done
          for src in "${FINAL_SHOTS[@]}"; do
            cp "$src" "${DEST_REL}/final-state/"
          done
          git add "$DEST_REL"
          git commit -qm "e2e-livedit: PR #${PR_NUMBER} run ${RUN_ID} screenshots"
          # Parallel PR runs push to the same branch; a plain push loses the
          # race ("fetch first") and failed the whole job after every scenario
          # had passed. Each run writes only its own pr-N/run-M directory, so
          # rebasing onto the newer tip never conflicts — fetch, rebase, retry.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push -q origin "$BRANCH"; then pushed=1; break; fi
            echo "screenshot push rejected (attempt ${attempt}); rebasing onto the remote tip"
            git fetch -q origin "$BRANCH"
            git rebase -q FETCH_HEAD
            sleep $((attempt * 2))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::could not push screenshots to ${BRANCH} after 5 attempts"
            exit 1
          fi

          # PR #61 follow-up — surface the actual error text next to the
          # screenshots, not just a URL. Playwright drops a per-attempt
          # context MD into playwright-report/data/<hash>.md with the
          # test name + the assertion failure + any chat-runner /
          # browser-console errors the fixtures (`fixtures.ts`)
          # collected. Without these, the PR reviewer had to download
          # the artifact bundle to find out *why* a screenshot is red.
          ERR_CONTEXT_DIR="${GITHUB_WORKSPACE}/${FAIL_DIR}"
          ERR_CONTEXT_MDS=("${ERR_CONTEXT_DIR}"/*.md)

          # PR #61 follow-up — `build-stats.ts` parses admin.log +
          # playwright-report.json + ai-cost.json + metrics.json and emits a
          # Real-AI-cost block, an API-stats block, the issue #432 per-attempt
          # input-token breakdown table, and a per-scenario results table.
          # We splice it in between the screenshots and the error details.
          # Falls through silently if the script errors so a bug here
          # can't block the rest of the comment.
          STATS_FILE=/tmp/e2e-livedit-stats.md
          (
            cd "${GITHUB_WORKSPACE}"
            bun run apps/admin/e2e-livedit/lib/build-stats.ts > "$STATS_FILE"
          ) || echo "_(stats script failed; see workflow logs)_" > "$STATS_FILE"

          {
            printf '## e2e-livedit run [%s](https://github.com/%s/actions/runs/%s) — %s\n\n' \
              "$RUN_ID" "$REPO" "$RUN_ID" "$JOB_STATUS"
            printf 'Screenshots from this run (commit `%s`):\n\n' "${GITHUB_SHA::7}"

            if [ ${#FINAL_SHOTS[@]} -gt 0 ]; then
              printf '### Final state after publish\n\n'
              for src in "${FINAL_SHOTS[@]}"; do
                name=$(basename "$src")
                url="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${DEST_REL}/final-state/${name}"
                printf '![%s](%s)\n\n' "$name" "$url"
              done
            fi

            # What the plan picked and why, plus the weekly budget line.
            if [ -s "$PLAN_SUMMARY" ]; then
              cat "$PLAN_SUMMARY"
              printf '\n\n'
            fi

            # Stats block: chat-runner API counters + per-scenario table.
            if [ -s "$STATS_FILE" ]; then
              cat "$STATS_FILE"
              printf '\n'
            fi

            # Group errors by test name so a 3-attempt failure shows
            # under ONE collapsible block, not three. `awk` extracts the
            # `- Name: ` line and the `# Error details` block (between
            # that header and the next `# ` header). Each block is
            # capped at 6000 chars per scenario so a multi-attempt
            # failure doesn't blow past GitHub's 65k-char comment limit.
            if [ ${#ERR_CONTEXT_MDS[@]} -gt 0 ]; then
              printf '### Errors from chat + assertions\n\n'
              printf 'Per-attempt error details captured by the Playwright + chat-runner + console-error trackers (see [`fixtures.ts`](https://github.com/%s/blob/%s/apps/admin/e2e-livedit/fixtures.ts)).\n\n' "$REPO" "${GITHUB_SHA}"
              # Build a tmp file keyed by test name → concatenated errors.
              rm -rf /tmp/e2e-errors && mkdir -p /tmp/e2e-errors
              for md in "${ERR_CONTEXT_MDS[@]}"; do
                test_name=$(awk -F': ' '/^- Name:/ {sub(/^.*>> /, "", $0); sub(/^- Name: /, "", $0); print; exit}' "$md")
                [ -z "$test_name" ] && test_name="(unknown test)"
                # File-name-safe key.
                slug=$(printf '%s' "$test_name" | tr -c '[:alnum:]' '_' | cut -c1-80)
                {
                  printf -- '----- attempt @ %s -----\n' "$(basename "$md" .md | cut -c1-8)"
                  awk '/^# Error details/{flag=1; next} /^# / && flag {exit} flag {print}' "$md"
                } >> "/tmp/e2e-errors/${slug}.txt"
                # Remember pretty name for the slug.
                printf '%s' "$test_name" > "/tmp/e2e-errors/${slug}.name"
              done
              for txt in /tmp/e2e-errors/*.txt; do
                slug=$(basename "$txt" .txt)
                name=$(cat "/tmp/e2e-errors/${slug}.name")
                printf '<details><summary><b>%s</b></summary>\n\n```\n' "$name"
                head -c 6000 "$txt"
                if [ "$(wc -c < "$txt")" -gt 6000 ]; then
                  printf '\n…(truncated; full text in the artifact bundle)\n'
                fi
                printf '\n```\n\n</details>\n\n'
              done
            fi

            if [ ${#FAIL_SHOTS[@]} -gt 0 ]; then
              # PR #61 follow-up — DON'T number these globally. Pre-fix
              # the comment showed e.g. "Attempt 1" through "Attempt 8"
              # for 8 PNGs that were actually 4 scenarios × 2 attempts,
              # implying the same scenario retried 8 times. Each PNG is
              # one attempt's failure shot from across the run; the
              # errors block above is where the per-scenario / per-
              # attempt grouping lives.
              printf '### Failure screenshots\n\n'
              printf 'One screenshot per failed attempt across all scenarios. Scenario + attempt grouping is in the **Errors from chat + assertions** block above.\n\n'
              for src in "${FAIL_SHOTS[@]}"; do
                name=$(basename "$src")
                url="https://raw.githubusercontent.com/${REPO}/${BRANCH}/${DEST_REL}/failure/${name}"
                printf '![%s](%s)\n\n' "$name" "$url"
              done
            fi

            printf '_Auto-posted by `.github/workflows/e2e-livedit.yml`. The full Playwright HTML report + admin.log + DB dump are in the run’s artifact bundle._\n'
          } > /tmp/e2e-livedit-comment.md

          cd "$GITHUB_WORKSPACE"
          bash "$GITHUB_WORKSPACE/apps/admin/e2e-livedit/lib/sticky-comment.sh" "$PR_NUMBER" /tmp/e2e-livedit-comment.md

      - name: Teardown compose
        if: always()
        run: docker compose down --volumes --remove-orphans
