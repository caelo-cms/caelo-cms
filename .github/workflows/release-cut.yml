# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — one-button release from the GitHub Actions UI.
#
# Actions → release-cut → Run workflow → pick the bump. The release is cut
# from the main commit as it is at that moment, then gated, tagged and
# published from a release branch, so main stays open for merges the
# whole time (before, every merge during a cut cost the release):
#
#   1. Gate: the real-AI suite must be green on that main commit X (main
#      gets no real-AI run per push; a green run on X is reused).
#   2. scripts/release.ts writes the release commit R on top of X (version
#      bump, changelog, catalogue, release declaration) and tags it vX.Y.Z.
#   3. R is checked before anything is pushed: it may touch only what the
#      release script writes (scripts/release-commit.ts), and lint, the
#      lockstep check and the catalogue check must pass on it, so a broken
#      release commit never gets its tag.
#   4. release/vX.Y.Z (= R) and the tag are pushed together, and
#      release.yml is dispatched on the tag (a tag pushed with GITHUB_TOKEN
#      never triggers other workflows, a dispatch does).
#   5. Once everything is published, release.yml opens the release PR
#      release/vX.Y.Z → main. Merging it moves main to the new version.
#      Only the next cut waits for that merge: it refuses while a tagged
#      release is not on main yet (release-checks.ts taggedAheadProblem).
#
# Why the tag is not on main: main requires linear history, so the release
# commit reaches it as a squashed copy. The changelog and the release
# checks find the previous release by version, never by ancestry. See
# RELEASING.md ("One-button release").

name: release-cut

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch | minor | major | x.y.z"
        required: false
        default: "patch"
        type: string
      # Release-manifest declaration (epic #696). Signed into the
      # release manifest; see RELEASING.md ("Security releases").
      security:
        description: "Security release — requires every advisory below to be a PUBLISHED GitHub Security Advisory of this repo"
        required: false
        default: false
        type: boolean
      advisories:
        description: "GHSA ids this release fixes, comma-separated (required when security is set)"
        required: false
        default: ""
        type: string
      ack_contract_migrations:
        description: "Acknowledge destructive (contract) migrations since the previous release — installs must then upgrade manually"
        required: false
        default: false
        type: boolean
      ack_infra_neutral:
        description: "Infra-contract files changed but add/remove no IAM, secret or resource (no INFRA_CONTRACT_VERSION bump)"
        required: false
        default: false
        type: boolean
      owner_action:
        description: "Breaking release only (a type!: commit since the previous release): one sentence of what the Owner must do, shown in Settings → Updates. Required then, refused otherwise."
        required: false
        default: ""
        type: string

permissions:
  contents: write
  # Dispatches e2e-livedit.yml and release.yml.
  actions: write

concurrency:
  group: release-cut
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cut:
    name: cut, tag and dispatch the release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Changelog generation walks conventional commits since the
          # previous vX.Y.Z tag — needs full history.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assemble the release declaration
        id: decl
        # Inputs reach the shell through env, never `${{ }}` inside run:
        # (a free-text input interpolated into the script is injectable).
        env:
          SECURITY: ${{ inputs.security }}
          ADVISORIES: ${{ inputs.advisories }}
          ACK_CONTRACT: ${{ inputs.ack_contract_migrations }}
          ACK_INFRA: ${{ inputs.ack_infra_neutral }}
        run: |
          set -euo pipefail
          flags=""
          [ "${SECURITY}" = "true" ] && flags="${flags} --security"
          [ "${ACK_CONTRACT}" = "true" ] && flags="${flags} --ack-contract-migrations"
          [ "${ACK_INFRA}" = "true" ] && flags="${flags} --ack-infra-neutral"
          if [ -n "${ADVISORIES}" ]; then
            # GHSA ids and commas only — anything else is refused here,
            # before it reaches a command line.
            if ! printf '%s' "${ADVISORIES}" | grep -Eq '^[A-Za-z0-9, -]+$'; then
              echo "::error::advisories may only contain GHSA ids separated by commas"
              exit 1
            fi
            flags="${flags} --advisories=$(printf '%s' "${ADVISORIES}" | tr -d ' ')"
          fi
          echo "flags=${flags}" >> "$GITHUB_OUTPUT"

      - name: Validate the release declaration (before the paid real-AI gate)
        # security=true is refused unless every advisory is a PUBLISHED
        # GitHub Security Advisory of this repo; contract migrations and
        # infra-contract changes since the previous tag need their
        # acknowledgement inputs. scripts/release-checks.ts has the rules.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version || 'patch' }}
          FLAGS: ${{ steps.decl.outputs.flags }}
          # Free text: passed as one quoted argument, never through FLAGS.
          OWNER_ACTION: ${{ inputs.owner_action }}
        run: |
          owner=()
          if [ -n "${OWNER_ACTION}" ]; then owner=(--owner-action "${OWNER_ACTION}"); fi
          # shellcheck disable=SC2086 # FLAGS is a validated word list.
          bun run scripts/release.ts "${VERSION_INPUT}" ${FLAGS} "${owner[@]}" --checks-only

      - name: Record the cut base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Gate — real-AI suite green on this main commit
        # Main is not covered per push (e2e-livedit.yml runs on PRs only),
        # so this is where main gets its real-AI run: once per release, on
        # the exact commit being released. A green run on this SHA from an
        # earlier attempt of this cut is reused instead of paid for twice.
        # Otherwise one is dispatched on release-gate/<sha>, a branch pinned
        # to this commit: main stays open during the cut, so a dispatch on
        # main could run a newer commit than the one being released. A
        # workflow_dispatch made with GITHUB_TOKEN does trigger the target
        # workflow.
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_FILE: e2e-livedit.yml
          JOB_NAME: Real-AI live-edit scenario
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # Prints the id of a finished e2e-livedit run on $SHA whose AI job
          # succeeded; fails when there is none. A green workflow is not
          # enough (its AI job may have been skipped by a cost gate).
          ai_job_ok() {
            for id in $(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$SHA&status=success&per_page=50" --jq '.workflow_runs[].id'); do
              ok=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                --jq "[.jobs[] | select(.name == \"$JOB_NAME\" and .conclusion == \"success\")] | length")
              if [ "$ok" -gt 0 ]; then echo "$id"; return 0; fi
            done
            return 1
          }
          if run=$(ai_job_ok); then
            echo "::notice::real-AI suite already green on $SHA (run $run)."
            exit 0
          fi
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git push origin "$SHA:refs/heads/release-gate/$SHA"
          gh workflow run "$WORKFLOW_FILE" --ref "release-gate/$SHA"
          echo "dispatched $WORKFLOW_FILE on release-gate/$SHA; waiting for the run to appear"
          run=""
          for _ in $(seq 1 20); do
            run=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&head_sha=$SHA&per_page=20" \
              --jq "[.workflow_runs[] | select(.created_at >= \"$since\") | .id] | first // empty")
            [ -n "$run" ] && break
            sleep 15
          done
          if [ -z "$run" ]; then
            echo "::error::no e2e-livedit run appeared for $SHA within 5 minutes. Check Actions → E2E Live Edit, then re-run release-cut."
            exit 1
          fi
          echo "waiting for run $run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/$run"
          # Poll until both the run and its AI job have finished. `gh run
          # watch` exits early on a transient API error (an HTTP 502 failed
          # the v0.10.54 cut while the suite was still running), and the run
          # can report "completed" before its job does (or the reverse), so
          # neither alone is trusted. An API error is retried on the next
          # poll, never a verdict. The deadline sits inside the step's
          # timeout-minutes so the failure names the run.
          deadline=$(( $(date +%s) + 70 * 60 ))
          while :; do
            run_state=$(gh api "repos/$REPO/actions/runs/$run" --jq .status 2>/dev/null) || run_state="api-error"
            job_state=$(gh api "repos/$REPO/actions/runs/$run/jobs?per_page=100" \
              --jq "[.jobs[] | select(.name == \"$JOB_NAME\") | .status] | first // \"missing\"" 2>/dev/null) || job_state="api-error"
            [ "$run_state" = "completed" ] && [ "$job_state" = "completed" ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::run ${GITHUB_SERVER_URL}/${REPO}/actions/runs/$run did not finish within 70 minutes (run: $run_state, AI job: $job_state). Check the run, then re-run release-cut."
              exit 1
            fi
            sleep 60
          done
          if ! ai_job_ok >/dev/null; then
            echo "::error::the real-AI live-edit suite did not pass on $SHA (run ${GITHUB_SERVER_URL}/${REPO}/actions/runs/$run). Fix main, then re-run release-cut."
            exit 1
          fi
          echo "::notice::real-AI suite green on $SHA (run $run)."

      - name: Guard — Tier-1 signing key must be configured
        # release.ts re-signs the Tier-1 plugin manifests; on a
        # maintainer machine the key comes from `.caelo-dev-key`, in CI
        # it must come from the repo secret/variable pair. Fail with
        # the setup instruction instead of the script's generic error.
        #
        # env: injection, NOT ${{ }} inside run: — an interpolated
        # secret is materialized into the generated shell script, where
        # xtrace-style debug logging can echo it past the log masker.
        env:
          CAELO_TIER1_PRIVATE_KEY: ${{ secrets.CAELO_TIER1_PRIVATE_KEY }}
          CAELO_TIER1_PUBLIC_KEY: ${{ vars.CAELO_TIER1_PUBLIC_KEY }}
        run: |
          if [ -z "$CAELO_TIER1_PRIVATE_KEY" ] || [ -z "$CAELO_TIER1_PUBLIC_KEY" ]; then
            echo "::error::Missing Tier-1 signing key. One-time setup (from a checkout with .caelo-dev-key):"
            echo "::error::  jq -r .privateKeyHex .caelo-dev-key | gh secret set CAELO_TIER1_PRIVATE_KEY"
            echo "::error::  jq -r .publicKeyHex  .caelo-dev-key | gh variable set CAELO_TIER1_PUBLIC_KEY"
            exit 1
          fi

      - name: Run the release script (bump + changelog + manifests + commit)
        env:
          # sign-tier1-manifest.ts uses this pair instead of the
          # maintainer-local `.caelo-dev-key` file.
          CAELO_TIER1_PRIVATE_KEY: ${{ secrets.CAELO_TIER1_PRIVATE_KEY }}
          CAELO_TIER1_PUBLIC_KEY: ${{ vars.CAELO_TIER1_PUBLIC_KEY }}
          # The advisory lookup re-runs here (release.ts checks before it bumps).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version || 'patch' }}
          FLAGS: ${{ steps.decl.outputs.flags }}
          OWNER_ACTION: ${{ inputs.owner_action }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          owner=()
          if [ -n "${OWNER_ACTION}" ]; then owner=(--owner-action "${OWNER_ACTION}"); fi
          # shellcheck disable=SC2086 # FLAGS is a validated word list.
          bun run scripts/release.ts "${VERSION_INPUT}" ${FLAGS} "${owner[@]}"

      - name: Determine the new version
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check the release commit before anything is pushed
        # Nobody reviews the release commit, and the tag it gets is what
        # ships. Everything the release script wrote is checked here, in
        # seconds: a broken stamp (v0.10.65: a plugin manifest Biome
        # refused) fails the cut instead of failing release.yml after the
        # tag exists.
        run: |
          set -euo pipefail
          bun scripts/release-commit.ts verify
          bun run --filter=@caelo-cms/admin sync
          bun run lint
          bun scripts/release.ts --check
          bun scripts/power-catalogue.ts --check
          git diff --exit-code

      - name: Push the release branch + tag, dispatch the release pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # --atomic: the tag never exists without its branch (release.yml
          # opens the release PR from it). A leftover release/v* branch of
          # an aborted cut is replaced: the tag the script made locally is
          # refused if it already exists remotely, so a published release
          # is never overwritten.
          git push --atomic --force-with-lease="release/v${V}" origin \
            "HEAD:refs/heads/release/v${V}" "refs/tags/v${V}"
          gh workflow run release.yml --ref "v${V}" -f tag="v${V}"
          echo "::notice::v${V} is tagged on release/v${V}. release.yml publishes it, then opens the release PR into main."

      - name: Delete the real-AI gate branch (best-effort)
        if: always()
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: git push origin --delete "release-gate/${BASE}" 2>/dev/null || true
