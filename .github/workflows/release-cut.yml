# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — one-button release from the GitHub Actions UI.
#
# The local flow (`bun scripts/release.ts patch && git push
# --follow-tags`) requires a clean checkout sitting on main. This
# workflow removes that dependency: Actions → release-cut →
# Run workflow → pick the bump. Same script, same artifacts.
#
# Two phases, because main-protection forbids direct pushes (the
# release commit must land via PR; the admin bypass is
# pull_request-mode only):
#
#   1. `cut` (workflow_dispatch): runs scripts/release.ts on a fresh
#      main checkout in CI — version bump, changelog stanza, Tier-1
#      manifest re-sign, release commit — then opens the release PR.
#      The tag the script creates locally is deleted here: the tag
#      must point at the MERGED commit on main, which doesn't exist
#      yet at cut time.
#   2. `tag-and-publish` (push to main touching version.ts — only
#      release commits do): tags the merge commit `vX.Y.Z` and
#      dispatches release.yml with that tag. The dispatch is explicit
#      because a tag pushed with GITHUB_TOKEN never triggers other
#      workflows. release.yml re-runs the full lint+typecheck+test
#      gate on the tagged commit, so a broken release commit still
#      cannot ship artifacts.
#
# Merging the release PR: PRs opened with the repo GITHUB_TOKEN get no
# workflow runs, so the PR's required checks sit pending. Either merge
# with `gh pr merge --squash --admin` (safe — release.yml's gate is
# the real artifact gate), or configure a `RELEASE_PAT` repo secret
# (fine-grained PAT, contents:write + pull-requests:write on this
# repo) and the PR behaves like any other: checks run, normal merge.
# See RELEASING.md ("One-button release").

name: release-cut

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch | minor | major | x.y.z"
        required: false
        default: "patch"
        type: string
  push:
    branches: [main]
    # Only release commits touch the version constant — this keeps the
    # tag-and-publish job off every routine merge.
    paths: ["packages/shared/src/version.ts"]

permissions:
  contents: write
  pull-requests: write
  # tag-and-publish dispatches release.yml.
  actions: write

concurrency:
  group: release-cut
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cut:
    name: cut release PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Changelog generation walks conventional commits since the
          # previous vX.Y.Z tag — needs full history.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the release script (bump + changelog + manifests + commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run scripts/release.ts "${{ inputs.version || 'patch' }}"

      - name: Determine the new version
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Drop the local tag
        # The script tags its own commit, but the version that ships is
        # the MERGED commit on main — phase 2 tags that one instead.
        run: git tag -d "v${{ steps.ver.outputs.version }}"

      - name: Push release branch + open PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          # --force: release/v* branches are ephemeral; a leftover from
          # an aborted run must not block the re-cut.
          git push --force origin "HEAD:release/v${V}"
          gh pr create \
            --base main \
            --head "release/v${V}" \
            --title "chore(release): v${V}" \
            --body "$(printf '%s\n' \
              "Cut by the release-cut workflow (run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
              "" \
              "**Merging this PR ships v${V}**: the merge commit is tagged automatically and release.yml publishes npm + GHCR + AR + the GitHub Release after its own quality gate passes." \
              "" \
              "If the required checks below stay pending (PR was opened with the repo GITHUB_TOKEN), merge with \`gh pr merge --squash --admin\` — release.yml re-runs the full gate on the tagged commit before anything publishes." \
            )" \
          || { echo "PR already exists:"; gh pr view "release/v${V}" --json url --jq .url; }

  tag-and-publish:
    name: tag merged release + dispatch pipeline
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version + guard against re-tagging
        id: ver
        run: |
          V=$(jq -r .version package.json)
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${V}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${V} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release commit
        if: steps.ver.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.ver.outputs.version }}" "${{ github.sha }}"
          git push origin "v${{ steps.ver.outputs.version }}"

      - name: Dispatch the release pipeline
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --ref "v${{ steps.ver.outputs.version }}" \
            -f tag="v${{ steps.ver.outputs.version }}"

      - name: Delete the release branch (best-effort)
        if: steps.ver.outputs.exists == 'false'
        run: git push origin --delete "release/v${{ steps.ver.outputs.version }}" || true
