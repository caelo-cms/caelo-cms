# SPDX-License-Identifier: MPL-2.0
#
# Environment for the Copilot coding agent (the job name is fixed by GitHub).
# The agent runs these steps before it starts working, so it can run
# `bun test`, `bunx biome check .` and `bunx tsc -b` like CI does — e.g. for
# the weekly model-catalog issues opened by model-catalog-refresh.yml.

name: copilot-setup-steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile
