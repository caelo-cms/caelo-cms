# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — weekly model check, implemented by the Copilot coding agent.
#
# 1. scripts/refresh-model-catalog.ts lists the models Anthropic / OpenAI /
#    Google currently serve and works out which slots of
#    packages/admin-core/src/ai/model-catalog.json should move to a newer id.
#    Only this job holds the provider keys; it calls list-models endpoints
#    only (no generation, no spend).
# 2. If anything moved, it opens an issue whose body carries the exact
#    changes plus the full definition of done (catalog, ai_pricing migration,
#    Anthropic capability predicates, SDK bump, tests) and assigns it to the
#    Copilot coding agent, which opens the PR. Humans review and merge.
#    While such an issue is open, later runs comment on it instead of opening
#    another one.
#
# Secrets:
#   ANTHROPIC_API_KEY_E2E, OPENAI_API_KEY, GOOGLE_GENERATIVE_AI_API_KEY —
#     provider keys; a missing one is skipped and named in the issue.
#   COPILOT_ASSIGN_TOKEN — fine-grained PAT of a user with a Copilot seat
#     (Issues: read/write, Contents: read, Metadata: read). The repo
#     GITHUB_TOKEN cannot assign Copilot; without this secret the issue is
#     still created, just unassigned (a warning says so).

name: model-catalog-refresh

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-catalog-refresh
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: check for newer models
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check provider model lists
        id: check
        # env: injection, NOT ${{ }} inside run: — keeps the keys out of the
        # generated shell script.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_E2E }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          bun scripts/refresh-model-catalog.ts --issue-body "$RUNNER_TEMP/issue.md"
          cat "$RUNNER_TEMP/issue.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the update to the Copilot coding agent
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN != '' }}
          LABEL: model-catalog
          # GraphQL documents live in env so their $variables never meet the shell.
          FIND_COPILOT: >-
            query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) {
            suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) { nodes { login ... on Bot { id } } } } }
          ASSIGN: >-
            mutation($issue: ID!, $actors: [ID!]!) {
            replaceActorsForAssignable(input: { assignableId: $issue, actorIds: $actors }) { __typename } }
        run: |
          gh label create "$LABEL" --color 5319e7 \
            --description "Weekly model catalog update" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/issue.md"
            echo "Updated open issue #$open."
            exit 0
          fi
          url=$(gh issue create \
            --title "chore(ai): update model catalog to newer models" \
            --label "$LABEL" \
            --body-file "$RUNNER_TEMP/issue.md")
          echo "Created $url"
          if [ "$HAS_ASSIGN_TOKEN" != "true" ]; then
            echo "::warning::COPILOT_ASSIGN_TOKEN not set — assign $url to Copilot manually."
            exit 0
          fi
          issue_id=$(gh issue view "$url" --json id --jq .id)
          bot_id=$(gh api graphql \
            -f query="$FIND_COPILOT" \
            -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id')
          if [ -z "$bot_id" ]; then
            echo "::warning::Copilot coding agent is not available in this repository — assign $url manually."
            exit 0
          fi
          gh api graphql \
            -f query="$ASSIGN" \
            -f issue="$issue_id" -f "actors[]=$bot_id" > /dev/null
          echo "Assigned $url to Copilot."
