# SPDX-License-Identifier: MPL-2.0
#
# Real-GCP upgrader smoke test (#818).
#
# Every release is installed on a dedicated, throwaway smoke install by
# that install's OWN upgrader job, started the only way any install starts
# it: Settings → Updates, one click + the Owner's password. This workflow
# never starts an update — there is no side channel into the upgrader (the
# maintainer decision on #879). It checks, read-only and from outside, what
# that path produced: install.json, the serving revisions' image digests
# against the signed manifest, Cloud Run's Ready condition, and the
# upgrader's self-update. See scripts/upgrader-smoke.ts.
#
# Why: nothing after the upgrader's state lock had ever run against real
# GCP IAM before the first live in-app update died on an IAM condition
# (#799), and the v0.10.51 gateway exited on start only on Cloud Run
# (#821). Fakes cannot catch either class (CLAUDE.md §4, §6).
#
# Runs:
#   - from release.yml (workflow_call, mode `gate`) for every release tag,
#     after the images and the signed manifest are published and BEFORE
#     npm and the GitHub Release: the candidate's manifest must verify and
#     the smoke install must cleanly serve the release before it (at least
#     the previous stable release, installed through Settings → Updates).
#     A failure blocks the release.
#   - by hand (workflow_dispatch, mode `verify`) once the maintainer has
#     installed a published release on the smoke install through
#     Settings → Updates: the install must serve exactly that release.
#
# Credentials: Workload Identity Federation only, no service-account key
# and no repository secret (CLAUDE.md §11.C). The identity it gets can
# only READ the smoke project. One-time setup (smoke project, WIF pool
# with its attribute condition, the protected `upgrader-smoke`
# environment, the CI service account's grants, the repository variables
# below) is in docs/dev/upgrader-smoke.md.
#
# Repository variables:
#   UPGRADER_SMOKE                 `required` (run, block on failure) or
#                                  `off` (releases ship without it, with a
#                                  warning). Anything else fails the release:
#                                  the choice is explicit, never a silent skip.
#   UPGRADER_SMOKE_PROJECT         the smoke install's GCP project id
#   UPGRADER_SMOKE_REGION          its region
#   UPGRADER_SMOKE_WIF_PROVIDER    projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   UPGRADER_SMOKE_SA_EMAIL        the CI service account it impersonates

name: upgrader-smoke

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Published release to check on the smoke install (e.g. 0.11.0)."
        required: true
      mode:
        description: "verify: the smoke install runs this release (installed via Settings → Updates). gate: the release-time check."
        type: choice
        options: [verify, gate]
        default: verify
  workflow_call:
    inputs:
      candidate:
        description: "The release being cut (no leading v)."
        type: string
        required: true
      invoked_by:
        # A called workflow sees the CALLER's github.event_name, and
        # release.yml itself runs on workflow_dispatch (release-cut
        # dispatches it), so the event name cannot tell a release gate from
        # a maintainer's manual run. This input can: it is only set here.
        description: "Who runs the check: `release` (release.yml's gate)."
        type: string
        default: release

# Nothing by default; each job names what it needs. Only the smoke job, in
# the protected environment, may mint an OIDC token.
permissions: {}

# One smoke install: two checks never interleave with each other.
concurrency:
  group: upgrader-smoke
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Outside the protected environment and without any token: an `off`
  # release must not wait for an environment reviewer or touch GCP.
  decide:
    name: decide whether the smoke test runs
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.mode.outputs.run }}
    steps:
      - name: Decide whether the smoke test runs
        id: mode
        env:
          MODE: ${{ vars.UPGRADER_SMOKE }}
          # `release` when release.yml calls it; empty on a manual dispatch,
          # which defaults to `dispatch`.
          INVOKED_BY: ${{ inputs.invoked_by || 'dispatch' }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${CANDIDATE}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::candidate '${CANDIDATE}' is not a release version like 0.11.0-rc.1"
            exit 1
          fi
          case "${MODE}" in
            required)
              echo "run=true" >> "${GITHUB_OUTPUT}"
              ;;
            off)
              if [ "${INVOKED_BY}" != "release" ]; then
                echo "::error::UPGRADER_SMOKE is 'off'; set it to 'required' (docs/dev/upgrader-smoke.md) to run the smoke test."
                exit 1
              fi
              echo "::warning::The real-GCP upgrader smoke test is OFF (repository variable UPGRADER_SMOKE=off): ${CANDIDATE} ships without the smoke install's check (#818)."
              echo "run=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Repository variable UPGRADER_SMOKE is '${MODE}'. Set it to 'required' once the smoke project is set up (docs/dev/upgrader-smoke.md), or to 'off' to release without the real-GCP upgrader smoke test (#818)."
              exit 1
              ;;
          esac

  smoke:
    name: upgrader smoke (${{ inputs.candidate }})
    needs: [decide]
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The WIF provider admits only this environment's tokens; protect it in
    # the repository settings (docs/dev/upgrader-smoke.md, step 3).
    environment: upgrader-smoke
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # WIF: the GitHub OIDC token is exchanged for a short-lived GCP token.
    steps:
      - uses: actions/checkout@v7
        with:
          # previousStable() reads the release tags.
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install cosign (the signed release manifest is verified like an upgrader does)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Authenticate to the smoke project via Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.UPGRADER_SMOKE_WIF_PROVIDER }}
          service_account: ${{ vars.UPGRADER_SMOKE_SA_EMAIL }}

      - name: Check what Settings → Updates installed on the smoke install
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PROJECT: ${{ vars.UPGRADER_SMOKE_PROJECT }}
          REGION: ${{ vars.UPGRADER_SMOKE_REGION }}
          # workflow_call (release.yml) has no mode input: always the gate.
          SMOKE_MODE: ${{ inputs.mode || 'gate' }}
        run: |
          set -euo pipefail
          bun scripts/upgrader-smoke.ts --candidate "${CANDIDATE}" --mode "${SMOKE_MODE}" \
            --project-id "${PROJECT}" --region "${REGION}"
