# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — bug-intake image workflow (issue #981, epic #901).
#
# Publishes the bug intake (apps/bug-intake) as a signed public image on
# every merge to main that changes it, so whoever operates an intake pulls
# and verifies a reviewed artifact instead of building on a laptop. This
# workflow only builds and publishes: where and how an intake runs is the
# operator's business and stays out of the repo (no project ids, domains,
# deploy credentials or deploy steps here).
#
# Tags: `ghcr.io/caelo-cms/bug-intake:<full commit sha>` (immutable, what
# an operator pins) and `:main` (moves with every publish).
#
# Trust chain, same approach as release-images.yml: keyless cosign via
# GitHub OIDC -> Fulcio, so the signing certificate names this exact
# workflow file + ref. cosign 3.x stores signatures and attestations as
# OCI referrers of the image digest; consumers verify with:
#
#   cosign verify ghcr.io/caelo-cms/bug-intake@<digest> \
#     --certificate-identity="https://github.com/caelo-cms/caelo-cms/.github/workflows/bug-intake-image.yml@refs/heads/main" \
#     --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
#
# The identity is exact (not a regexp): only this workflow, run on main,
# can produce a passing signature, so an image built by any other
# workflow or from any other ref fails verification. The SBOM (SPDX,
# generated by BuildKit) is attested with the same identity and checks
# with `cosign verify-attestation --type spdxjson` plus the same flags.
#
# Single-arch (linux/amd64), matching the admin + gateway images in
# release-images.yml: Bun SIGILLs under QEMU on arm64
# (https://github.com/oven-sh/bun/issues/15044) and the Dockerfile runs
# `bun install` in the target platform.

name: bug-intake-image

on:
  push:
    branches: [main]
    paths:
      - "apps/bug-intake/**"
      # The install <-> intake contract, including redactBugText (the
      # redaction the intake re-applies to every report it receives).
      - "packages/shared/src/bug-intake.ts"
      - ".github/workflows/bug-intake-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign signing via GitHub OIDC.
  id-token: write

# Never cancel a publish half-way (a pushed but unsigned image would be
# left behind); queued runs collapse so the newest commit wins `:main`.
concurrency:
  group: bug-intake-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/caelo-cms/bug-intake
  # Same Node 24 opt-in as release-images.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bug-intake-image.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  publish:
    name: test + build + push + sign (bug-intake)
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to publish from a ref other than main
        # workflow_dispatch can be started on any branch. Publishing from
        # one would push an image whose signature fails the consumer's
        # verify (identity is pinned to refs/heads/main), so stop loudly.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::bug-intake images are published from refs/heads/main only (got ${GITHUB_REF})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Unit tests (intake + shared contract module)
        # No database: these suites are pure. The root bunfig preload is a
        # no-op without the DB URLs, and the destructive reset stays off
        # (CAELO_TEST_DB_RESET is not set).
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/bug-intake/src -name '*.test.ts' ! -name 'contract.test.ts' | sort)
          bun test "${files[@]}" packages/shared/src/bug-intake.test.ts

      - name: Contract test (admin-core BugIntakeClient <-> intake handler)
        run: bun test apps/bug-intake/src/contract.test.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.title=Caelo CMS — bug intake
            org.opencontainers.image.description=Receives AI-detected bug reports from opted-in Caelo installs and files one GitHub issue per defect

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/bug-intake/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bug-intake
          cache-to: type=gha,scope=bug-intake,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless / OIDC)
        # Every tag points at the same digest, so one signature over the
        # digest covers `:<sha>` and `:main`.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the SBOM with cosign
        # BuildKit already generated an SPDX SBOM (`sbom: true`), but its
        # attestation manifest is unsigned. Re-attesting it with cosign
        # binds the SBOM to this workflow's identity, verifiable with the
        # same flags as the signature.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json
          jq -e '.spdxVersion' sbom.spdx.json >/dev/null \
            || { echo "::error::BuildKit SBOM missing or not SPDX for ${IMAGE}@${DIGEST}"; exit 1; }
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Verify signature + SBOM attestation (the consumer's check)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity="${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" > /dev/null
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type spdxjson \
            --certificate-identity="${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" > /dev/null
          {
            echo "### bug-intake image published"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Tags: \`${GITHUB_SHA}\`, \`main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
