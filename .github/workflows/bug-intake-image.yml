# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — bug-intake image workflow (issue #981, epic #901).
#
# Publishes the bug intake (apps/bug-intake) as a signed public image on
# every merge to main that changes it, so whoever operates an intake pulls
# and verifies a reviewed artifact instead of building on a laptop. This
# workflow only builds and publishes: where and how an intake runs is the
# operator's business and stays out of the repo (no project ids, domains,
# deploy credentials or deploy steps here).
#
# Jobs:
#   - test     every event: the intake's unit tests + the contract test.
#   - gate     every event: build the minimal image (apps/bug-intake/image.ts,
#              docs/dev/service-images.md) without pushing, then check it the
#              way release-images.yml checks the gateway's: only allowlisted
#              files, no shell, non-root, the Trivy gate, and a boot smoke
#              against a Firestore emulator. Read-only token.
#   - publish  push to main / workflow_dispatch, after `test` and `gate`:
#              build, push, sign, attest, verify. The only job with
#              packages:write and id-token:write.
#
# Tags: `ghcr.io/caelo-cms/bug-intake:<full commit sha>` (immutable, what
# an operator pins) and `:main` (moves with every publish).
#
# Trust chain, same approach as release-images.yml: keyless cosign via
# GitHub OIDC -> Fulcio, so the signing certificate names this exact
# workflow file + ref. cosign 3.x stores signatures and attestations as
# OCI referrers of the image digest; consumers verify with:
#
#   cosign verify ghcr.io/caelo-cms/bug-intake@<digest> \
#     --certificate-identity="https://github.com/caelo-cms/caelo-cms/.github/workflows/bug-intake-image.yml@refs/heads/main" \
#     --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
#
# The identity is exact (not a regexp): only this workflow, run on main,
# can produce a passing signature, so an image built by any other
# workflow or from any other ref fails verification. The SBOM (SPDX,
# generated by BuildKit) is attested with the same identity and checks
# with `cosign verify-attestation --type spdxjson` plus the same flags.
#
# Single-arch (linux/amd64), matching the admin + gateway images in
# release-images.yml: Bun SIGILLs under QEMU on arm64
# (https://github.com/oven-sh/bun/issues/15044) and the Dockerfile runs
# `bun install` in the target platform.

name: bug-intake-image

on:
  push:
    branches: [main]
    paths:
      # Derived from apps/bug-intake/Dockerfile, not guessed. The builder
      # stage `COPY . .`s the tree and runs `bun install --frozen-lockfile
      # --production --filter @caelo-cms/bug-intake`, so the installed
      # closure depends on bun.lock, the root package.json and bunfig.toml
      # (`linker = "hoisted"`), and the build context on .dockerignore. It
      # then bundles apps/bug-intake/src/main.ts with scripts/service-image.ts
      # (`stage`), which inlines packages/shared/src and the npm closure;
      # the runtime stage carries that bundle and Bun, nothing else.
      # @caelo-cms/shared is the intake's only workspace runtime dependency
      # and has no workspace dependencies of its own. @caelo-cms/admin-core
      # is a devDependency (contract test and boot smoke only): it is not in
      # the image, and ci.yml runs its tests on every PR. The gate job also
      # reads .trivyignore.yaml.
      # packages/shared/src/** includes bug-intake.ts: the install <->
      # intake contract and redactBugText.
      - "apps/bug-intake/**"
      - "packages/shared/package.json"
      - "packages/shared/src/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".dockerignore"
      - "scripts/service-image.ts"
      - ".trivyignore.yaml"
      - ".github/workflows/bug-intake-image.yml"
  pull_request:
    branches: [main]
    paths:
      # Same list as the push trigger; see the derivation there.
      - "apps/bug-intake/**"
      - "packages/shared/package.json"
      - "packages/shared/src/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".dockerignore"
      - "scripts/service-image.ts"
      - ".trivyignore.yaml"
      - ".github/workflows/bug-intake-image.yml"
  workflow_dispatch:

# Read-only by default; only the publish job is granted more.
permissions:
  contents: read

# A new push to a PR supersedes its in-flight run. Publishes are never
# cancelled half-way (a pushed but unsigned image would be left behind);
# queued publishes collapse so the newest commit wins `:main`.
concurrency:
  group: bug-intake-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/caelo-cms/bug-intake
  # Same Node 24 opt-in as release-images.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bug-intake-image.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  test:
    name: test (bug-intake unit + contract)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Unit tests (intake + shared contract module)
        # No database: these suites are pure. The root bunfig preload is a
        # no-op without the DB URLs, and the destructive reset stays off
        # (CAELO_TEST_DB_RESET is not set).
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/bug-intake/src -name '*.test.ts' ! -name 'contract.test.ts' | sort)
          bun test "${files[@]}" packages/shared/src/bug-intake.test.ts

      - name: Contract test (admin-core BugIntakeClient <-> intake handler)
        run: bun test apps/bug-intake/src/contract.test.ts

  gate:
    name: image gate (bug-intake)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for the checks (amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/bug-intake/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: caelo-bug-intake:smoke
          # Reads the publish job's cache; a PR writes its own scope, so PR
          # builds never evict main's layers (ci.yml's admin-smoke pattern).
          cache-from: |
            type=gha,scope=bug-intake
            type=gha,scope=bug-intake-pr
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,scope=bug-intake-pr,mode=max' || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Install dependencies (frozen lockfile)
        # The boot smoke drives the image with admin-core's BugIntakeClient.
        run: bun install --frozen-lockfile

      - name: Image contents (allowlist, non-root, no shell)
        env:
          IMAGE: caelo-bug-intake:smoke
        run: |
          set -euo pipefail
          # Every file the image adds to its distroless base must match the
          # spec; no shell anywhere; a numeric non-root USER.
          bun scripts/service-image.ts verify apps/bug-intake/image.ts "${IMAGE}"
          # Belt and braces: the shell must not start, as root or otherwise.
          if docker run --rm --entrypoint /bin/sh "${IMAGE}" -c true 2>/dev/null; then
            echo "::error::${IMAGE} has a working /bin/sh"; exit 1
          fi

      - name: Trivy gate (high + critical)
        env:
          IMAGE: caelo-bug-intake:smoke
          SBOM: /app/apps/bug-intake/dist/bundled-packages.cdx.json
          # The same pinned scanner and flags as release-images.yml's gate.
          TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache" "${RUNNER_TEMP}/sbom"
          # The bundle inlines npm packages a filesystem scan cannot see;
          # the image carries their SBOM next to the bundle.
          id="$(docker create "${IMAGE}")"
          docker cp "${id}:${SBOM}" "${RUNNER_TEMP}/sbom/bundle.cdx.json"
          docker rm "${id}" >/dev/null
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              -v "${RUNNER_TEMP}/sbom:/sbom:ro" \
              -v "${GITHUB_WORKSPACE}/.trivyignore.yaml:/trivyignore.yaml:ro" \
              "${TRIVY}" "$@"
          }
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /trivyignore.yaml --exit-code 1 "${IMAGE}"
          trivy sbom --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /trivyignore.yaml --exit-code 1 /sbom/bundle.cdx.json

      - name: Start Firestore emulator
        # The jar ci.yml runs for the store tests, verified by SHA-256.
        env:
          EMULATOR_VERSION: 1.22.0
          EMULATOR_SHA256: 9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c
        run: |
          jar="$RUNNER_TEMP/cloud-firestore-emulator.jar"
          curl -fsSL -o "$jar" "https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v${EMULATOR_VERSION}.jar"
          echo "${EMULATOR_SHA256}  $jar" | sha256sum -c -
          nohup "$JAVA_HOME_21_X64/bin/java" -jar "$jar" --host=127.0.0.1 --port=8915 > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fs "http://127.0.0.1:8915/" > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/firestore-emulator.log"
          exit 1

      - name: Bug intake boot smoke (refuses to start unconfigured, registers, stores, answers)
        env:
          IMAGE: caelo-bug-intake:smoke
        run: |
          set -euo pipefail
          # No configuration: the intake must refuse to start (no defaults).
          if docker run --rm "${IMAGE}" >/dev/null 2>&1; then
            echo "::error::the bug intake started without its configuration"; exit 1
          fi
          # A throwaway App key: GitHub writes are paused, and the model key
          # is unusable on purpose (image-smoke.ts takes the outage path).
          key="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)"
          docker run -d --name intake-smoke --network host \
            -e PORT=8977 \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:8915 \
            -e GITHUB_APP_ID=1 -e GITHUB_APP_INSTALLATION_ID=1 -e GITHUB_APP_PRIVATE_KEY="${key}" \
            -e BUG_INTAKE_PUBLIC_REPO=caelo-cms/image-smoke \
            -e BUG_INTAKE_FIRESTORE_PROJECT=demo-image-smoke -e BUG_INTAKE_FIRESTORE_DATABASE='(default)' \
            -e BUG_INTAKE_ISSUE_THRESHOLD_INSTALLS=1 \
            -e BUG_INTAKE_MAX_NEW_ISSUES_PER_DAY=5 -e BUG_INTAKE_MAX_NEW_SUGGESTIONS_PER_DAY=5 \
            -e BUG_INTAKE_MAX_REGISTRATIONS_PER_HOUR=10 \
            -e BUG_INTAKE_ISSUES_PAUSED=true \
            -e ANTHROPIC_API_KEY=image-smoke-unusable -e BUG_INTAKE_MATCH_MODEL=claude-haiku-5-5 \
            "${IMAGE}"
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8977/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          test -n "${ok}" || { docker logs intake-smoke; echo "::error::the bug intake did not answer /healthz"; exit 1; }
          status=0
          bun apps/bug-intake/scripts/image-smoke.ts http://127.0.0.1:8977 || status=$?
          docker logs intake-smoke
          docker rm -f intake-smoke >/dev/null
          exit "${status}"

  publish:
    name: build + push + sign (bug-intake)
    # Positive list of publishing events (as in release-images.yml): an
    # event type GitHub adds later defaults to not publishing.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Failing tests or a failing image gate block the push.
    needs: [test, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing via GitHub OIDC.
      id-token: write

    steps:
      - name: Refuse to publish from a ref other than main
        # workflow_dispatch can be started on any branch. Publishing from
        # one would push an image whose signature fails the consumer's
        # verify (identity is pinned to refs/heads/main), so stop loudly.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::bug-intake images are published from refs/heads/main only (got ${GITHUB_REF})."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.title=Caelo CMS — bug intake
            org.opencontainers.image.description=Receives AI-detected bug reports from opted-in Caelo installs and files one GitHub issue per defect

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/bug-intake/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bug-intake
          cache-to: type=gha,scope=bug-intake,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image with cosign (keyless / OIDC)
        # Every tag points at the same digest, so one signature over the
        # digest covers `:<sha>` and `:main`.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the SBOM with cosign
        # BuildKit already generated an SPDX SBOM (`sbom: true`), but its
        # attestation manifest is unsigned. Re-attesting it with cosign
        # binds the SBOM to this workflow's identity, verifiable with the
        # same flags as the signature.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json
          jq -e '.spdxVersion' sbom.spdx.json >/dev/null \
            || { echo "::error::BuildKit SBOM missing or not SPDX for ${IMAGE}@${DIGEST}"; exit 1; }
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Verify signature + SBOM attestation (the consumer's check)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity="${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" > /dev/null
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type spdxjson \
            --certificate-identity="${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" > /dev/null
          {
            echo "### bug-intake image published"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Tags: \`${GITHUB_SHA}\`, \`main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
