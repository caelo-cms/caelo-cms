# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — bug-intake image workflow (issue #981, epic #901).
#
# Publishes the bug intake (apps/bug-intake) as a signed public image on
# every merge to main that changes it, so whoever operates an intake pulls
# and verifies a reviewed artifact instead of building on a laptop. This
# workflow only builds and publishes: where and how an intake runs is the
# operator's business and stays out of the repo (no project ids, domains,
# deploy credentials or deploy steps here).
#
# Jobs:
#   - test     every event: the intake's unit tests + the contract test.
#   - build    pull_request only: build the image, no push, no signing,
#              read-only token (the release-images.yml PR build-only run).
#   - publish  push to main / workflow_dispatch, after `test`: build, push,
#              sign, attest, verify. The only job with packages:write and
#              id-token:write.
#
# Tags: `ghcr.io/caelo-cms/bug-intake:<full commit sha>` (immutable, what
# an operator pins) and `:main` (moves with every publish).
#
# Trust chain, same approach as release-images.yml: keyless cosign via
# GitHub OIDC -> Fulcio, so the signing certificate names this exact
# workflow file + ref. cosign 3.x stores signatures and attestations as
# OCI referrers of the image digest; consumers verify with:
#
#   cosign verify ghcr.io/caelo-cms/bug-intake@<digest> \
#     --certificate-identity="https://github.com/caelo-cms/caelo-cms/.github/workflows/bug-intake-image.yml@refs/heads/main" \
#     --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
#
# The identity is exact (not a regexp): only this workflow, run on main,
# can produce a passing signature, so an image built by any other
# workflow or from any other ref fails verification. The SBOM (SPDX,
# generated by BuildKit) is attested with the same identity and checks
# with `cosign verify-attestation --type spdxjson` plus the same flags.
#
# Single-arch (linux/amd64), matching the admin + gateway images in
# release-images.yml: Bun SIGILLs under QEMU on arm64
# (https://github.com/oven-sh/bun/issues/15044) and the Dockerfile runs
# `bun install` in the target platform.

name: bug-intake-image

on:
  push:
    branches: [main]
    paths:
      # Derived from apps/bug-intake/Dockerfile, not guessed. The builder
      # stage `COPY . .`s the tree and runs `bun install --frozen-lockfile
      # --production --filter @caelo-cms/bug-intake`, so the installed
      # closure depends on bun.lock, the root package.json and bunfig.toml
      # (`linker = "hoisted"`), and the build context on .dockerignore. The
      # runtime stage then copies exactly: package.json, node_modules,
      # packages/shared/{package.json,src} and apps/bug-intake/{package.json,src}
      # (and the Dockerfile itself, under apps/bug-intake/).
      # @caelo-cms/shared is the intake's only workspace runtime dependency
      # and has no workspace dependencies of its own. @caelo-cms/admin-core
      # is a devDependency (contract test only): it is not in the image,
      # and ci.yml runs its tests on every PR.
      # packages/shared/src/** includes bug-intake.ts: the install <->
      # intake contract and redactBugText.
      - "apps/bug-intake/**"
      - "packages/shared/package.json"
      - "packages/shared/src/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".dockerignore"
      - ".github/workflows/bug-intake-image.yml"
  pull_request:
    branches: [main]
    paths:
      # Same list as the push trigger; see the derivation there.
      - "apps/bug-intake/**"
      - "packages/shared/package.json"
      - "packages/shared/src/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".dockerignore"
      - ".github/workflows/bug-intake-image.yml"
  workflow_dispatch:

# Read-only by default; only the publish job is granted more.
permissions:
  contents: read

# A new push to a PR supersedes its in-flight run. Publishes are never
# cancelled half-way (a pushed but unsigned image would be left behind);
# queued publishes collapse so the newest commit wins `:main`.
concurrency:
  group: bug-intake-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/caelo-cms/bug-intake
  # Same Node 24 opt-in as release-images.yml.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/bug-intake-image.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  test:
    name: test (bug-intake unit + contract)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Unit tests (intake + shared contract module)
        # No database: these suites are pure. The root bunfig preload is a
        # no-op without the DB URLs, and the destructive reset stays off
        # (CAELO_TEST_DB_RESET is not set).
        run: |
          set -euo pipefail
          mapfile -t files < <(find apps/bug-intake/src -name '*.test.ts' ! -name 'contract.test.ts' | sort)
          bun test "${files[@]}" packages/shared/src/bug-intake.test.ts

      - name: Contract test (admin-core BugIntakeClient <-> intake handler)
        run: bun test apps/bug-intake/src/contract.test.ts

  build:
    name: build only (bug-intake)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/bug-intake/Dockerfile
          platforms: linux/amd64
          push: false
          # Reads the publish job's cache, writes its own scope, so PR
          # builds never evict main's layers (ci.yml's admin-smoke pattern).
          cache-from: |
            type=gha,scope=bug-intake
            type=gha,scope=bug-intake-pr
          cache-to: type=gha,scope=bug-intake-pr,mode=max

  publish:
    name: build + push + sign (bug-intake)
    # Positive list of publishing events (as in release-images.yml): an
    # event type GitHub adds later defaults to not publishing.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Failing tests block the push.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing via GitHub OIDC.
      id-token: write

    steps:
      - name: Refuse to publish from a ref other than main
        # workflow_dispatch can be started on any branch. Publishing from
        # one would push an image whose signature fails the consumer's
        # verify (identity is pinned to refs/heads/main), so stop loudly.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::bug-intake images are published from refs/heads/main only (got ${GITHUB_REF})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.title=Caelo CMS — bug intake
            org.opencontainers.image.description=Receives AI-detected bug reports from opted-in Caelo installs and files one GitHub issue per defect

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/bug-intake/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bug-intake
          cache-to: type=gha,scope=bug-intake,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless / OIDC)
        # Every tag points at the same digest, so one signature over the
        # digest covers `:<sha>` and `:main`.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the SBOM with cosign
        # BuildKit already generated an SPDX SBOM (`sbom: true`), but its
        # attestation manifest is unsigned. Re-attesting it with cosign
        # binds the SBOM to this workflow's identity, verifiable with the
        # same flags as the signature.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json
          jq -e '.spdxVersion' sbom.spdx.json >/dev/null \
            || { echo "::error::BuildKit SBOM missing or not SPDX for ${IMAGE}@${DIGEST}"; exit 1; }
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Verify signature + SBOM attestation (the consumer's check)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity="${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" > /dev/null
          cosign verify-attestation "${IMAGE}@${DIGEST}" --type spdxjson \
            --certificate-identity="${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer="${OIDC_ISSUER}" > /dev/null
          {
            echo "### bug-intake image published"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Tags: \`${GITHUB_SHA}\`, \`main\`"
          } >> "${GITHUB_STEP_SUMMARY}"
