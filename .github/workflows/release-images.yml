# SPDX-License-Identifier: MPL-2.0
#
# Caelo CMS — release-image workflow.
#
# Builds + publishes the runtime container images (admin, gateway, and
# since #1328 the MCP-Auth-Proxy `mcp-auth-proxy` — its own minimal
# bundle image, no database code) and the `caelo-ops` image (provisioning CLI + pinned Pulumi / gcloud /
# cosign, epic #696) to GHCR on every push to main + every tagged
# release. Signs every image with cosign (keyless / OIDC). admin,
# gateway and mcp-auth-proxy are single-arch (linux/amd64) for v0.x — every supported
# managed cloud runtime (GCP Cloud Run, AWS Fargate, Azure Container
# Apps) defaults to amd64, and ARM-host operators (Apple Silicon dev,
# Hetzner CAX, Ampere) build locally from the repo. Multi-arch will
# return for them once Bun's QEMU SIGILL on arm64 is fixed upstream
# (https://github.com/oven-sh/bun/issues/15044). The ops image IS
# multi-arch (amd64 + arm64): its Dockerfile runs every Bun step in a
# $BUILDPLATFORM builder, so Bun never executes under QEMU — it is the
# image operators run from Cloud Shell or an ARM laptop.
#
# Minimal images (#1327): a matrix entry with a `spec` (the gateway) is
# built and checked BEFORE the push build — its content allowlist, non-root
# user and missing shell (scripts/service-image.ts verify), a Trivy gate on
# high + critical findings, and a boot smoke. The push build then reuses the
# checked build's layers from the cache. See docs/dev/service-images.md.
#
# Also runs build-only on every pull_request against main + every
# merge_group speculative run (issue #54) — catches Dockerfile
# regressions that the post-merge push trigger only surfaces after they
# ship (the bug class #53 fixed). The push / sign / mirror steps gate
# POSITIVELY on `push || workflow_call || workflow_dispatch` so
# pull_request + merge_group events build the image but never publish
# (no fork-PR-secrets failures, no `gh-readonly-queue/...` unmerged-
# image clutter in registries); the build-push-action's `push:` flag
# follows the same positive condition. The two matrix jobs are also
# required status checks on the `main-protection` ruleset, so a PR
# whose Docker build fails cannot be merged.
#
# CLAUDE.md §11.C: end-users never build these images. They consume
# pre-built mirrors per provider:
#   - GHCR (ghcr.io/caelo-cms/<service>) — canonical, used by Compose.
#   - GCP public AR (europe-west1-docker.pkg.dev/caelo-website/
#     caelo-cms-images/<service>) — Cloud Run rejects ghcr.io directly.
#   - AWS public ECR + Azure ACR will land alongside the P15 cloud
#     adapters; same pattern (workflow pushes once per release; stack
#     references the public URL).
#
# Retention: release tags live forever; the per-merge `main-<sha7>`
# dev images are pruned after 7 days — GHCR via registry-retention.yml,
# the AR mirror via native cleanup policies. See
# docs/maintainer-public-registry-setup.md ("Retention").

name: release-images

on:
  push:
    branches: [main]
    # P21 ship 1 — `tags: [v*]` removed. Tag releases are now driven by
    # release.yml which calls this workflow via `workflow_call` after
    # the lint/typecheck/test gate passes. That makes the full release
    # atomic: if Docker fails, npm doesn't publish + no GitHub Release
    # is created. Push-to-main still emits :main + :main-<sha7>.
  pull_request:
    branches: [main]
  merge_group:
    # GitHub's native merge queue (when #34 enables it) re-runs required
    # checks on the merge group; without this trigger the new PR gate
    # would silently skip the queue. Zero cost to include now.
  workflow_call:
  workflow_dispatch:

# Required for cosign keyless signing via OIDC.
permissions:
  contents: read
  packages: write
  id-token: write

# A rapid `git push` to a PR branch supersedes the prior build's
# relevance; cancelling the in-flight job saves ~6 min of CI per push.
# Push-to-main builds keep `cancel-in-progress: false` so a release-
# bound build is never interrupted by a follow-up commit.
concurrency:
  group: release-images-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Opt every JavaScript-based action into the Node 24 runtime ahead
  # of GitHub's June-2026 cutover. The actions already work fine; a
  # follow-up advisory ("targets Node 20 but being forced to run on
  # Node 24") will keep printing until docker/* + google-github-actions/
  # auth ship action.yml updates with `runs.using: node24`. Bump those
  # pins when their next majors land — the warning vanishes then.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAMESPACE: caelo-cms

jobs:
  build:
    name: build + push (${{ matrix.service }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin
            dockerfile: apps/admin/Dockerfile
            platforms: linux/amd64
          - service: gateway
            dockerfile: apps/api-gateway/Dockerfile
            platforms: linux/amd64
            # #1327 — a minimal image: its content spec, checked below
            # together with the Trivy gate before anything is pushed.
            spec: apps/api-gateway/image.ts
            # The bundle's SBOM inside the image (scripts/service-image.ts).
            sbom: /app/apps/api-gateway/dist/bundled-packages.cdx.json
          # #1328 — the remote-MCP OAuth broker + proxy, out of the visitor
          # gateway into its own minimal service image (same checks).
          - service: mcp-auth-proxy
            dockerfile: apps/mcp-auth-proxy/Dockerfile
            platforms: linux/amd64
            spec: apps/mcp-auth-proxy/image.ts
            sbom: /app/apps/mcp-auth-proxy/dist/bundled-packages.cdx.json
          - service: ops
            dockerfile: packages/provisioning/Dockerfile.ops
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (multi-arch ops image)
        # Only the RUN steps of the ops runtime stage execute under
        # emulation (apt, dpkg, sha256sum) — never Bun; see
        # packages/provisioning/Dockerfile.ops.
        if: matrix.service == 'ops'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build ops image for the boot smoke (amd64, no push)
        # The multi-arch build below pushes but cannot `load` into the
        # local daemon, so the smoke builds the runner's own platform
        # separately. Same cache scope: the push build reuses its layers.
        if: matrix.service == 'ops'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: caelo-ops:smoke
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Boot smoke (caelo-ops --version + pinned tools)
        # Runs on PRs too: a Dockerfile.ops regression (wrong stack path,
        # missing dist, a tool that no longer starts) fails here instead
        # of in an operator's Cloud Shell.
        if: matrix.service == 'ops'
        run: |
          set -euo pipefail
          expected="$(jq -r .version package.json)"
          out="$(docker run --rm caelo-ops:smoke --version)"
          echo "${out}"
          echo "${out}" | grep -qF "Caelo v${expected}" \
            || { echo "::error::caelo-ops --version printed '${out}', expected Caelo v${expected}"; exit 1; }
          docker run --rm --entrypoint sh caelo-ops:smoke -euc '
            test "$(id -u)" != 0 || { echo "ops image runs as root" >&2; exit 1; }
            command -v cms-provision >/dev/null
            node --version
            pulumi version
            cosign version
            gcloud version
            gcloud beta --help >/dev/null
            test -f /opt/caelo-ops/packages/provisioning/stacks/gcp/Pulumi.yaml
            # The CLI writes Pulumi.<stack>.yaml into the stack dir as the
            # non-root user: exercise exactly that (local backend, no cloud).
            export PULUMI_BACKEND_URL="file://${HOME}/.pulumi-smoke" PULUMI_CONFIG_PASSPHRASE=smoke
            mkdir -p "${HOME}/.pulumi-smoke"
            cd /opt/caelo-ops/packages/provisioning/stacks/gcp
            pulumi stack init smoke --non-interactive
            pulumi config set caelo-gcp:domain smoke.example --stack smoke --non-interactive
            test -f Pulumi.smoke.yaml
          '
          # The upgrader entry (#696) loads its whole module graph, then
          # fails at the metadata server it cannot reach outside Google
          # Cloud — its own structured error, not a missing module.
          set +e
          up="$(docker run --rm caelo-ops:smoke upgrader --ignored-arg 2>&1)"
          code=$?
          set -e
          echo "${up}"
          test "${code}" -ne 0 || { echo "::error::caelo-ops upgrader succeeded outside Google Cloud"; exit 1; }
          echo "${up}" | grep -q '"message":"upgrader: ' \
            || { echo "::error::caelo-ops upgrader did not reach its entry point"; exit 1; }
          # The converge job's entry (#819), the way the job is deployed
          # (--command=caelo-converge-job --args=converge-job): it reaches
          # its entry point, with a scrubbed environment.
          set +e
          cj="$(docker run --rm -e PULUMI_BACKEND_URL=file:///tmp/evil --entrypoint caelo-converge-job caelo-ops:smoke converge-job 2>&1)"
          code=$?
          set -e
          echo "${cj}"
          test "${code}" -ne 0 || { echo "::error::caelo-converge-job succeeded outside Google Cloud"; exit 1; }
          echo "${cj}" | grep -q '"message":"converge-job: ' \
            || { echo "::error::caelo-converge-job did not reach its entry point"; exit 1; }
          # #883 review: any other argument is refused before code runs.
          for bad in destroy owner-reset "converge-job --extra"; do
            set +e
            # shellcheck disable=SC2086 # word-split on purpose: argv under test.
            out="$(docker run --rm --entrypoint caelo-converge-job caelo-ops:smoke ${bad} 2>&1)"
            code=$?
            set -e
            test "${code}" -eq 64 || { echo "::error::caelo-converge-job ${bad} exited ${code}, expected 64"; exit 1; }
            echo "${out}" | grep -q "refused" || { echo "::error::caelo-converge-job ${bad} did not refuse"; exit 1; }
          done
          docker run --rm --entrypoint caelo-ops caelo-ops:smoke converge-job destroy >/dev/null 2>&1 \
            && { echo "::error::caelo-ops converge-job destroy was not refused"; exit 1; } || true

      # ──────────────────────────────────────────────────────────────
      # #1327 — minimal images (matrix entries with a `spec`): before
      # anything is pushed, the image must hold only what its spec lists,
      # run as non-root without a shell, pass the Trivy gate and boot.
      # Runs on PRs and on the release's workflow_call alike, so a release
      # never publishes an image the gate has not seen.
      # ──────────────────────────────────────────────────────────────
      - name: Build minimal image for the checks (amd64, no push)
        if: matrix.spec
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: caelo-${{ matrix.service }}:smoke
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Setup Bun (image checks)
        if: matrix.spec
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Image contents (allowlist, non-root, no shell)
        if: matrix.spec
        env:
          SPEC: ${{ matrix.spec }}
          IMAGE: caelo-${{ matrix.service }}:smoke
        run: |
          set -euo pipefail
          # Every file the image adds to its distroless base must match the
          # spec; no shell anywhere; a numeric non-root USER.
          bun scripts/service-image.ts verify "${SPEC}" "${IMAGE}"
          # Belt and braces: the shell must not start, as root or otherwise.
          if docker run --rm --entrypoint /bin/sh "${IMAGE}" -c true 2>/dev/null; then
            echo "::error::${IMAGE} has a working /bin/sh"; exit 1
          fi
          uid="$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")"
          echo "runs as ${uid}"

      - name: Trivy gate (high + critical)
        if: matrix.spec
        env:
          IMAGE: caelo-${{ matrix.service }}:smoke
          SBOM: ${{ matrix.sbom }}
          # aquasec/trivy 0.76.1, pinned by digest (cosign-verified against
          # the aquasecurity/trivy release workflow when it was pinned). The
          # image, not trivy-action: no third-party action script runs with
          # the job's token.
          TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache" "${RUNNER_TEMP}/sbom"
          # The bundle inlines npm packages a filesystem scan cannot see;
          # the image carries their SBOM next to the bundle (and Deno's).
          id="$(docker create "${IMAGE}")"
          docker cp "${id}:${SBOM}" "${RUNNER_TEMP}/sbom/bundle.cdx.json"
          docker rm "${id}" >/dev/null
          # --ignore-unfixed: a finding with no fixed version anywhere has no
          # action a PR could take; it would block every merge until Debian
          # or the vendor ships one. Fixable high/critical findings block.
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              -v "${RUNNER_TEMP}/sbom:/sbom:ro" \
              "${TRIVY}" "$@"
          }
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}"
          trivy sbom --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /sbom/bundle.cdx.json

      - name: Gateway boot smoke (Postgres, migrations, health, plugin self-check)
        if: matrix.service == 'gateway'
        env:
          IMAGE: caelo-gateway:smoke
          PGHOST: localhost
          PGPORT: 5432
          POSTGRES_USER: caelo
          POSTGRES_PASSWORD: caelo_ci
          PGPASSWORD: caelo_ci
          POSTGRES_DB: postgres
          ADMIN_ROLE_PASSWORD: caelo_admin_ci
          PUBLIC_ROLE_PASSWORD: caelo_public_ci
          PUBLIC_STAGING_ROLE_PASSWORD: caelo_public_staging_ci
          ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_admin
          PUBLIC_ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_public
          PUBLIC_DATABASE_URL: postgres://public_role:caelo_public_ci@localhost:5432/cms_public
          PUBLIC_STAGING_ADMIN_DATABASE_URL: postgres://admin_role:caelo_admin_ci@localhost:5432/cms_public_staging
          PUBLIC_STAGING_DATABASE_URL: postgres://public_staging_role:caelo_public_staging_ci@localhost:5432/cms_public_staging
        run: |
          set -euo pipefail
          # 1. Plugins: every shipped plugin verifies and the Deno sandbox
          #    runs a probe — no database needed.
          docker run --rm "${IMAGE}" apps/api-gateway/dist/image-self-check.js
          # 2. Boot against a migrated database, the way an install runs it:
          #    over TLS with verify-full (#1338). The database gets a server
          #    certificate for `postgres` from the self-hosted installer's own
          #    CA code, and the gateway verifies it against that CA.
          bun install --frozen-lockfile
          TLS_DIR="$(mktemp -d)"
          bun -e 'const m = await import("./packages/provisioning/src/self-hosted-db-tls.ts"); m.ensureSelfHostedDbTls(process.argv[1]);' "${TLS_DIR}"
          docker network create gw-smoke
          docker run -d --name gw-smoke-pg --network gw-smoke --network-alias postgres -p 5432:5432 \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB \
            postgres:17-alpine
          for i in $(seq 1 90); do
            docker exec gw-smoke-pg pg_isready -h 127.0.0.1 -U "${POSTGRES_USER}" && break
            sleep 1
          done
          docker exec gw-smoke-pg pg_isready -h 127.0.0.1 -U "${POSTGRES_USER}"
          # Postgres refuses a key it does not own: copy the pair in, then
          # switch TLS on (a reload is enough for ssl since PostgreSQL 10).
          docker cp "${TLS_DIR}/postgres-tls/server.crt" gw-smoke-pg:/var/lib/postgresql/server.crt
          docker cp "${TLS_DIR}/postgres-tls/server.key" gw-smoke-pg:/var/lib/postgresql/server.key
          docker exec gw-smoke-pg sh -c 'chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key && chmod 600 /var/lib/postgresql/server.key'
          docker exec gw-smoke-pg psql -U "${POSTGRES_USER}" -d postgres \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" \
            -c "ALTER SYSTEM SET ssl = 'on'" \
            -c "SELECT pg_reload_conf()"
          chmod +x packages/migrations/src/bootstrap.sh
          packages/migrations/src/bootstrap.sh
          bun run db:migrate
          docker run -d --name gw-smoke --network gw-smoke -p 8090:8080 \
            -e PORT=8080 -e CAELO_TRUSTED_PROXY_HOPS=0 \
            -v "${TLS_DIR}/postgres-tls/ca.crt:/etc/caelo/smoke-db-ca.crt:ro" \
            -e "PUBLIC_DATABASE_URL=postgres://public_role:caelo_public_ci@postgres:5432/cms_public?sslmode=verify-full&sslrootcert=/etc/caelo/smoke-db-ca.crt" \
            "${IMAGE}"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:8090/api/_caelo/health?deep=1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs gw-smoke
          test -n "${ok}" || { echo "::error::the gateway did not answer its deep health check"; exit 1; }
          curl -fsS http://localhost:8090/healthz
          curl -fsS http://localhost:8090/api/captcha/challenge >/dev/null
          if docker logs gw-smoke 2>&1 | grep -q "FAILED to load"; then
            echo "::error::a plugin failed to load in the gateway"; exit 1
          fi
          docker rm -f gw-smoke gw-smoke-pg >/dev/null

      - name: MCP-Auth-Proxy boot smoke (health, fixed 404, refuses to start unconfigured)
        if: matrix.service == 'mcp-auth-proxy'
        env:
          IMAGE: caelo-mcp-auth-proxy:smoke
        run: |
          set -euo pipefail
          # No CAELO_REMOTE_MCP: the proxy must refuse to start (no default).
          if docker run --rm "${IMAGE}" >/dev/null 2>&1; then
            echo "::error::the MCP-Auth-Proxy started without CAELO_REMOTE_MCP"; exit 1
          fi
          docker run -d --name proxy-smoke -p 8095:8080 \
            -e PORT=8080 -e CAELO_REMOTE_MCP=unavailable -e CAELO_TRUSTED_PROXY_HOPS=0 \
            "${IMAGE}"
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8095/api/mcp/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs proxy-smoke
          test -n "${ok}" || { echo "::error::the MCP-Auth-Proxy did not answer its health check"; exit 1; }
          # E14 a — remote MCP off: one fixed 404 to everything else.
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8095/api/mcp/chat)"
          test "${status}" = "404" || { echo "::error::expected the fixed 404, got ${status}"; exit 1; }
          docker rm -f proxy-smoke >/dev/null

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            # tag-builds → semver tags (v0.1.2 → 0.1.2 + 0.1 + latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
            # main-branch builds → :main + :main-<sha7>
            type=ref,event=branch
            type=sha,format=short,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://caelo-cms.com
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.title=Caelo CMS — ${{ matrix.service }}
            org.opencontainers.image.description=AI-first, open-source CMS — ${{ matrix.service }} runtime image

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          # PRs + merge-queue speculative runs build the image but do not
          # push. Only push (to main), workflow_call (from release.yml on
          # tag), and workflow_dispatch (manual) publish — listing those
          # positively means a future event type added by GitHub defaults
          # to build-only, not publish (so we never accidentally publish
          # unmerged or read-only-queue images).
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless / OIDC)
        if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign each tag's image digest. Cosign uses GitHub OIDC →
          # Sigstore Fulcio; verifiers check that the cert was issued
          # to this exact GitHub workflow + repo.
          for tag in $(echo "${TAGS}" | tr ',' ' '); do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Verify the signed image (sanity check)
        if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      # ──────────────────────────────────────────────────────────────
      # GCP public AR mirror — Cloud Run accepts *.docker.pkg.dev only.
      # Skipped if no WIF credential is configured (forks / first-run
      # before Caelo team sets up the mirror project).
      # ──────────────────────────────────────────────────────────────
      - name: Authenticate to GCP via Workload Identity Federation
        if: (github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && vars.GCP_PUBLIC_REGISTRY_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_PUBLIC_REGISTRY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLIC_REGISTRY_SA_EMAIL }}

      - name: Configure docker for GCP AR push
        if: (github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && vars.GCP_PUBLIC_REGISTRY_WIF_PROVIDER != ''
        run: gcloud auth configure-docker ${{ vars.GCP_PUBLIC_REGISTRY_REGION || 'europe-west1' }}-docker.pkg.dev --quiet

      - name: Install oras (referrer-aware registry copy)
        if: (github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && vars.GCP_PUBLIC_REGISTRY_WIF_PROVIDER != ''
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Mirror image (+ signatures) to GCP public AR
        if: (github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && vars.GCP_PUBLIC_REGISTRY_WIF_PROVIDER != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          AR_REGION: ${{ vars.GCP_PUBLIC_REGISTRY_REGION || 'europe-west1' }}
          AR_PROJECT: ${{ vars.GCP_PUBLIC_REGISTRY_PROJECT || 'caelo-website' }}
          AR_REPO: ${{ vars.GCP_PUBLIC_REGISTRY_REPO || 'caelo-cms-images' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `oras copy -r` (NOT `cosign copy`, NOT `docker pull/tag/push`)
          # so the signature travels with the image. cosign 3.x attaches
          # signatures as OCI *referrers* rather than the legacy
          # `<digest>.sig` tag, and `cosign copy` — deprecated in 3.x —
          # only moves the legacy tag scheme. It exits 0 while leaving
          # the AR copy unsigned, which is exactly how v0.10.23/24
          # shipped mirror images that `cms-provision upgrade` then
          # refused (`no signatures found`). `oras copy -r` walks the
          # referrer graph, so it is correct for both schemes.
          AR_BASE="${AR_REGION}-docker.pkg.dev/${AR_PROJECT}/${AR_REPO}/${{ matrix.service }}"
          # oras keeps its own credential store — the docker/gcloud
          # logins above don't cover it.
          echo "${GHCR_TOKEN}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          gcloud auth print-access-token \
            | oras login "${AR_REGION}-docker.pkg.dev" -u oauth2accesstoken --password-stdin
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do
            short_tag="${tag##*:}"
            oras copy -r "${GHCR_IMAGE}@${DIGEST}" "${AR_BASE}:${short_tag}"
          done

      - name: Verify the mirrored image is signed (gate)
        # The bug this guards against is silent: a mirror step that
        # copies the image but drops the signature exits 0, and nobody
        # finds out until an operator's `cms-provision upgrade` refuses
        # to roll days later. Verify the AR copy with the same identity
        # check operators run, and fail the release here instead.
        if: (github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && vars.GCP_PUBLIC_REGISTRY_WIF_PROVIDER != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          AR_REGION: ${{ vars.GCP_PUBLIC_REGISTRY_REGION || 'europe-west1' }}
          AR_PROJECT: ${{ vars.GCP_PUBLIC_REGISTRY_PROJECT || 'caelo-website' }}
          AR_REPO: ${{ vars.GCP_PUBLIC_REGISTRY_REPO || 'caelo-cms-images' }}
        run: |
          AR_BASE="${AR_REGION}-docker.pkg.dev/${AR_PROJECT}/${AR_REPO}/${{ matrix.service }}"
          cosign verify "${AR_BASE}@${DIGEST}" \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/release-images.yml@.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
